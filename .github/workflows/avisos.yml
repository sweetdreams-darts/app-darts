name: Avisos

on:
  schedule:
    - cron: "*/5 14-23,0-3 * * *"
  workflow_dispatch:

concurrency:
  group: avisos
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  avisos:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install google-auth requests cryptography
      - run: python scripts/avisos.py
        env:
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
          NFC_K_META: ${{ secrets.NFC_K_META }}
          NFC_K_FILE: ${{ secrets.NFC_K_FILE }}
          DURACION: "270"
