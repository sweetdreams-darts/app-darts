name: Avisos

# GitHub debería lanzar este robot con el horario de abajo, pero en la práctica solo lo hace 3 o 4 veces al día.
# Por eso cada vuelta dura unos 55 minutos y, al terminar, lanza ella misma la siguiente: así el robot está
# siempre encendido. El horario se queda solo de respaldo, por si la cadena se corta.
# Con el bar abierto (según «Reglas de reserva», con media hora de margen) revisa cada minuto; con el bar
# cerrado, cada 5 minutos, para no pasarse de las lecturas gratis de Firestore.
# Para pararlo: en la pestaña Actions, cancela la vuelta en curso (el horario lo volverá a arrancar más tarde)
# o desactiva el workflow (Avisos → ··· → Disable workflow).
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: avisos
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # para lanzar la siguiente vuelta

jobs:
  avisos:
    runs-on: ubuntu-latest
    timeout-minutes: 64
    steps:
      - name: Anotar la hora de inicio
        run: echo "INICIO=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install google-auth requests cryptography
      - name: Robot (55 minutos; cada minuto con el bar abierto, cada 5 con el bar cerrado)
        timeout-minutes: 58
        env:
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
          NFC_K_META: ${{ secrets.NFC_K_META }}
          NFC_K_FILE: ${{ secrets.NFC_K_FILE }}
        run: |
          # Si el robot se para por un error (por ejemplo, un fallo de red), se vuelve a arrancar con el tiempo que quede.
          # Si falla 5 veces seguidas, algo va mal de verdad: se para y no se lanza la siguiente vuelta.
          fallos=0
          while true; do
            queda=$(( 3300 - ($(date +%s) - INICIO) ))
            if [ "$queda" -lt 120 ]; then break; fi
            if DURACION=$queda python scripts/avisos.py; then break; fi
            fallos=$((fallos + 1))
            echo "::warning::El robot se ha parado con un error (vez $fallos de 5)"
            if [ "$fallos" -ge 5 ]; then exit 1; fi
            sleep 60
          done
      - name: Lanzar la siguiente vuelta
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run avisos.yml --ref main
