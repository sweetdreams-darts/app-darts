name: Trivial (reto diario y rankings)

# GitHub debería lanzar este robot con el horario de abajo, pero en la práctica solo lo hace 3 o 4 veces al día.
# Por eso cada vuelta dura unos 55 minutos (una pasada cada 10 minutos) y, al terminar, lanza ella misma la
# siguiente: así el robot está siempre encendido. El horario se queda solo de respaldo, por si la cadena se corta.
# Para pararlo: en la pestaña Actions, cancela la vuelta en curso (el horario lo volverá a arrancar más tarde)
# o desactiva el workflow (Trivial → ··· → Disable workflow).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: trivial
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # para lanzar la siguiente vuelta

jobs:
  trivial:
    runs-on: ubuntu-latest
    timeout-minutes: 64
    steps:
      - name: Anotar la hora de inicio
        run: echo "INICIO=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Robot (una pasada cada 10 minutos durante 55 minutos)
        timeout-minutes: 58
        env:
          ROBOT_EMAIL: ${{ secrets.ROBOT_EMAIL }}
          ROBOT_PASSWORD: ${{ secrets.ROBOT_PASSWORD }}
        run: |
          # Cada pasada dura como mucho 5 minutos.
          # Si fallan 3 seguidas, algo va mal de verdad: se para y no se lanza la siguiente vuelta.
          fallos=0
          while true; do
            if timeout 300 python scripts/trivial.py; then
              fallos=0
            else
              fallos=$((fallos + 1))
              echo "::warning::La pasada ha fallado (vez $fallos de 3)"
              if [ "$fallos" -ge 3 ]; then exit 1; fi
            fi
            if [ $(( $(date +%s) - INICIO + 600 )) -gt 3300 ]; then break; fi
            sleep 600
          done
      - name: Lanzar la siguiente vuelta
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run trivial.yml --ref main
