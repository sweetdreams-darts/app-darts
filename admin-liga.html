<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";

const auth = getAuth(app);
const db = getFirestore(app);
const $ = (id) => document.getElementById(id);
const MIN = 60000, Q = 15 * MIN;
const DIAS = ["dom", "lun", "mar", "mié", "jue", "vie", "sáb"];
const MESES = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
const pad = (n) => String(n).padStart(2, "0");
const hhmm = (ms) => { const d = new Date(ms); return pad(d.getHours()) + ":" + pad(d.getMinutes()); };
const iso = (d) => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const diaBonito = (ms) => { const d = new Date(ms); return DIAS[d.getDay()] + " " + d.getDate() + " " + MESES[d.getMonth()]; };
const el = (tag, txt, cls) => { const e = document.createElement(tag); if (txt) e.textContent = txt; if (cls) e.className = cls; return e; };
const norm = (s) => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]/g, "");
let dianas = [], nuevos = [], existentes = new Map(), bloqueos = new Map(), nombresSD = [], edit = null;

// <logica>
// Duración de cada partida (el bloqueo empieza 30 minutos antes de la hora del partido):
//   Parejas: niveles 1 a 5 → 1 h 15 · nivel 6 o más → 1 h 30
//   Equipos: niveles 1 a 5 → 2 h 15 · nivel 6 o más → 2 h 30
function duracion(cat, nivel) {
  const bajo = Number(nivel) >= 1 && Number(nivel) <= 5;
  return (cat === "parejas" ? (bajo ? 75 : 90) : (bajo ? 135 : 150)) * 60000;
}
function intervaloPara(cat, pMs, nivel) { return [pMs - 30 * 60000, pMs + duracion(cat, nivel)]; }
const finNormal = (b) => b.partidoMs + duracion(b.categoria, b.nivel);
// Una partida online puede ir en la misma diana, justo después de una de parejas. SOLO en ese caso:
// la de parejas se acorta hasta la hora de la online (p. ej. 20:00–21:30) y la online empieza a su hora, sin los 30 min previos.
const MIN_PAREJAS = 60 * 60000;    // lo mínimo que debe quedarle a la partida de parejas para jugar antes de que entre la online (1 h)
function encadenar(fila, filas, dianas) {
  const solapa = (a, b) => a[0] < b[1] && b[0] < a[1];
  const candidatas = [];
  for (const d of dianas.filter((x) => x.online)) {
    const bloq = filas.filter((r) => r !== fila && r.dianaId === d.id && solapa(r.iv, fila.iv));
    if (bloq.length !== 1 || bloq[0].p.categoria !== "parejas" || bloq[0].acortada) continue;
    const r = bloq[0], corte = fila.p.fechaMs, inicioP = r.p.fechaMs || r.iv[0] + 30 * 60000;
    const ivOnline = [corte, fila.iv[1]];
    if (corte >= r.iv[1] || corte - inicioP < MIN_PAREJAS) continue;
    if (filas.some((g) => g !== fila && g !== r && g.dianaId === d.id && solapa(g.iv, ivOnline))) continue;
    candidatas.push({ diana: d, tras: r, ivOnline, corte });
  }
  candidatas.sort((a, b) => (a.tras.p.nivel || 99) - (b.tras.p.nivel || 99) || dianas.indexOf(a.diana) - dianas.indexOf(b.diana));
  return candidatas[0] || null;
}
// Deshace un encadenado (la online vuelve a su horario normal y la de parejas recupera el suyo).
function deshacerEncadenado(f) {
  if (!f || !f.encadena) return;
  const t = f.encadena.tras;
  t.iv = f.encadena.antes;
  t.acortada = null;
  f.iv = intervaloPara("equipos", f.p.fechaMs, f.p.nivel);
  f.encadena = null;
}
function asignar(partidos, dianas, fijos) {
  const orden = partidos.slice().sort((a, b) => a.dia.localeCompare(b.dia) || a.nivel - b.nivel || (a.categoria === b.categoria ? 0 : a.categoria === "parejas" ? -1 : 1) || a.id.localeCompare(b.id));
  const filas = fijos.map((f) => ({ p: f.p, iv: f.iv, dianaId: f.dianaId, fijo: true, ref: f.ref }));
  const libre = (dId, iv, salvo) => !filas.some((f) => f !== salvo && f.dianaId === dId && iv[0] < f.iv[1] && f.iv[0] < iv[1]);
  for (const p of orden) {
    const iv = intervaloPara(p.categoria, p.fechaMs, p.nivel), online = p.categoria === "equipos";
    const fila = { p: p, iv: iv, dianaId: "" };
    let d = dianas.find((x) => (!online || x.online) && libre(x.id, iv, fila));
    if (!d && online) {
      for (let i = filas.length - 1; i >= 0 && !d; i--) {
        const r = filas[i];
        const g = dianas.find((x) => x.id === r.dianaId);
        if (r.fijo || r.p.categoria === "equipos" || !g || !g.online || !libre(g.id, iv, r)) continue;
        const h = dianas.find((x) => !x.online && libre(x.id, r.iv, r));
        if (h) { r.dianaId = h.id; d = g; }
      }
    }
    if (!d && online) {
      const c = encadenar(fila, filas, dianas);
      if (c) {
        d = c.diana;
        fila.iv = c.ivOnline;
        fila.encadena = { tras: c.tras, corte: c.corte, antes: c.tras.iv };
        c.tras.iv = [c.tras.iv[0], c.corte];
        c.tras.acortada = { antes: fila.encadena.antes, corte: c.corte, por: fila };
      }
    }
    if (d) fila.dianaId = d.id;
    filas.push(fila);
  }
  const res = filas.filter((f) => !f.fijo);
  res.todas = filas;
  return res;
}

// Explica por qué un partido se queda sin diana: quién ocupa las dianas en ese horario y cuántos partidos coinciden.
// Si se puede, propone pasar un partido de parejas ya bloqueado a una diana sin online para dejarle su sitio.
function explicar(f, filas, dianas) {
  const online = f.p.categoria === "equipos";
  const elegibles = dianas.filter((d) => !online || d.online);
  const solapa = (a, b) => a.iv[0] < b.iv[1] && b.iv[0] < a.iv[1];
  const ocupan = [];
  for (const d of elegibles) for (const r of filas) if (r !== f && r.dianaId === d.id && solapa(r, f)) ocupan.push({ diana: d, fila: r });
  let sugerencia = null;
  if (online) {
    for (const o of ocupan) {
      const r = o.fila;
      if (r.p.categoria !== "parejas") continue;
      const h = dianas.find((x) => !x.online && !filas.some((g) => g !== r && g.dianaId === x.id && solapa(g, r)));
      const quedaLibre = !filas.some((g) => g !== r && g !== f && g.dianaId === o.diana.id && solapa(g, f));
      if (h && quedaLibre) { sugerencia = { fila: r, desde: o.diana, hasta: h }; break; }
    }
  }
  const mismas = filas.filter((r) => r === f || solapa(r, f));
  let maximo = 0;
  for (const r of mismas) {
    const t = Math.max(r.iv[0], f.iv[0]);
    maximo = Math.max(maximo, mismas.filter((g) => g.iv[0] <= t && t < g.iv[1]).length);
  }
  const enlinea = dianas.filter((d) => d.online).length, sinOnline = dianas.length - enlinea;
  let pico = { p: 0, o: 0, necesarias: 0, ms: f.iv[0] };
  for (const t of [f.iv[0], ...mismas.map((r) => r.iv[0]).filter((v) => v > f.iv[0] && v < f.iv[1])]) {
    const ahora = mismas.filter((g) => g.iv[0] <= t && t < g.iv[1]);
    const p = ahora.filter((g) => g.p.categoria === "parejas").length, o = ahora.length - p;
    const necesarias = o + Math.max(0, p - sinOnline);
    if (necesarias > pico.necesarias) pico = { p, o, necesarias, ms: t };
  }
  return { ocupan, sugerencia, elegibles, coinciden: maximo, total: dianas.length, enlinea, sinOnline, pico };
}
// ---------- Bloqueos ya guardados: los encadenados se reconocen por cómo están colocados ----------
// (así los avisos se calculan siempre al momento y nunca se quedan viejos)
const etiquetaBloque = (b) => (b.categoria === "parejas" ? "Parejas" : "Equipos") + (b.nivel ? " N" + b.nivel : "") + " · " + (b.local || "?") + " – " + (b.visitante || "?");
const horaDe = (ms) => { const d = new Date(ms); return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); };
function relaciones(lista) {
  const rel = new Map();
  for (const o of lista) {
    if (o.estado !== "activo" || o.categoria === "parejas") continue;
    const p = lista.find((x) => x !== o && x.estado === "activo" && x.categoria === "parejas" && x.dianaId === o.dianaId && x.finMs === o.inicioMs && o.inicioMs === o.partidoMs && x.finMs < finNormal(x));
    if (p) { rel.set(o.id, { tras: p }); rel.set(p.id, { por: o }); }
  }
  return rel;
}
const acortadaSola = (b, rel) => b.estado === "activo" && b.categoria === "parejas" && b.finMs < finNormal(b) && !rel.has(b.id);
function alertaDe(b, rel) {
  const r = rel.get(b.id);
  if (r && r.tras) return "⏰ Empieza a su hora (" + horaDe(b.partidoMs) + ") justo después de " + etiquetaBloque(r.tras) + " (" + horaDe(r.tras.inicioMs) + "–" + horaDe(r.tras.finMs) + "), que debe terminar antes de las " + horaDe(b.inicioMs) + ". Avisa a los dos equipos.";
  if (r && r.por) return "⏰ Debe terminar antes de las " + horaDe(b.finMs) + " (su bloqueo normal llegaría a las " + horaDe(finNormal(b)) + "): después va " + etiquetaBloque(r.por) + " (" + horaDe(r.por.inicioMs) + "–" + horaDe(r.por.finMs) + "). Avisa a los dos equipos.";
  if (acortadaSola(b, rel)) return "⚠ Su bloqueo sigue acortado hasta las " + horaDe(b.finMs) + ", pero ya no va ninguna partida online detrás.";
  return "";
}
// Las notas antiguas que eran avisos automáticos ya no se enseñan: ahora se calculan al momento.
const notaManual = (b) => (b.nota && !/^(Empieza a su hora|Debe terminar antes)/.test(b.nota) ? b.nota : "");
function reservaEn(dId, iv, mapa) {
  for (let t = iv[0]; t < iv[1]; t += 15 * 60000) { const s = mapa.get(dId + "_" + t); if (s && s.tipo === "reserva") return true; }
  return false;
}
// Qué se puede hacer en cada diana con un partido de esta categoría y hora (sin contar el propio partido que se está moviendo).
function opcionesDiana(cat, pMs, nivel, otros, dianas, mapa) {
  const nom = intervaloPara(cat, pMs, nivel), online = cat !== "parejas";
  return dianas.map((d) => {
    if (online && !d.online) return { diana: d, estado: "sinOnline" };
    const solapa = otros.filter((b) => b.estado === "activo" && b.dianaId === d.id && b.inicioMs < nom[1] && nom[0] < b.finMs);
    if (!solapa.length) return reservaEn(d.id, nom, mapa) ? { diana: d, estado: "reserva" } : { diana: d, estado: "libre", iv: nom };
    if (solapa.length === 1) {
      const s = solapa[0];
      if (online && s.categoria === "parejas") {
        const iv = [pMs, nom[1]];
        if (pMs > s.inicioMs && pMs < s.finMs && pMs - s.partidoMs >= MIN_PAREJAS && !reservaEn(d.id, iv, mapa))
          return { diana: d, estado: "encadenar", iv: iv, socio: { b: s, iv: [s.inicioMs, pMs] } };
      }
      if (!online && s.categoria !== "parejas") {
        const corte = s.partidoMs, iv = [nom[0], corte];
        if (corte > nom[0] && corte < nom[1] && corte - pMs >= MIN_PAREJAS && corte < s.finMs && !reservaEn(d.id, iv, mapa))
          return { diana: d, estado: "encadenar", iv: iv, socio: { b: s, iv: [corte, s.finMs] } };
      }
    }
    return { diana: d, estado: "ocupada", por: solapa[0] };
  });
}
// Todo lo que cambia al mover, aplazar o descartar un partido: el que se acorta para encadenar, el propio partido,
// y el que deja de estar encadenado, que vuelve a su horario normal si le cabe.
function planCambios(viejo, nuevo, socio, lista, mapa) {
  const cambios = [];
  if (socio) cambios.push({ viejo: socio.b, nuevo: Object.assign({}, socio.b, { inicioMs: socio.iv[0], finMs: socio.iv[1] }) });
  cambios.push({ viejo: viejo, nuevo: nuevo });
  const r = viejo ? relaciones(lista).get(viejo.id) : null, antiguo = r && (r.tras || r.por);
  if (antiguo && !(socio && socio.b.id === antiguo.id)) {
    const iv = antiguo.categoria === "parejas" ? [antiguo.finMs, finNormal(antiguo)] : [antiguo.partidoMs - 30 * 60000, antiguo.inicioMs];
    const ocupado = lista.some((b) => b.id !== antiguo.id && b.id !== viejo.id && b.estado === "activo" && b.dianaId === antiguo.dianaId && b.inicioMs < iv[1] && iv[0] < b.finMs)
      || (nuevo && nuevo.estado === "activo" && nuevo.dianaId === antiguo.dianaId && nuevo.inicioMs < iv[1] && iv[0] < nuevo.finMs)
      || reservaEn(antiguo.dianaId, iv, mapa);
    if (!ocupado) cambios.push({ viejo: antiguo, nuevo: Object.assign({}, antiguo, antiguo.categoria === "parejas" ? { finMs: iv[1] } : { inicioMs: iv[0] }), restaurado: true });
  }
  return cambios;
}
// Lo que debería ocupar un bloqueo con las duraciones actuales (respetando los encadenados). null = ya está bien.
function ajusteDuracion(b, rel) {
  if (b.estado !== "activo") return null;
  const r = rel.get(b.id);
  let iv;
  if (r && r.tras) iv = [b.partidoMs, finNormal(b)];
  else if (r && r.por) iv = [b.partidoMs - 30 * 60000, Math.min(b.finMs, finNormal(b))];
  else iv = [b.partidoMs - 30 * 60000, finNormal(b)];
  return iv[0] === b.inicioMs && iv[1] === b.finMs ? null : iv;
}
// Partidos cuya fecha u hora ha cambiado la liga después de bloquearlos (y que no has movido tú a propósito).
function cambiosDeLiga(activos, partidos, cambiosAdmin) {
  const out = [];
  for (const b of activos) {
    if (b.origen === "manual") continue;
    const p = partidos.get(b.id);
    if (!p) continue;
    if (b.dia === p.dia && horaDe(b.partidoMs) === p.hora) continue;   // ya está donde dice la liga
    const c = cambiosAdmin.get(b.id);
    if (c && c.estado === "movido") {
      if (c.diaOriginal !== p.dia || c.horaOriginal !== p.hora) out.push({ b: b, p: p, movidoPorTi: true });
    } else if (b.dia !== p.dia || horaDe(b.partidoMs) !== p.hora) out.push({ b: b, p: p, movidoPorTi: false });
  }
  return out.sort((x, y) => x.b.partidoMs - y.b.partidoMs);
}
// </logica>

const idsSlots = (dId, iv) => { const r = []; for (let t = iv[0]; t < iv[1]; t += Q) r.push(dId + "_" + t); return r; };
const choque = (dId, iv, propio, mapa) => {
  for (const id of idsSlots(dId, iv)) {
    const e = mapa.get(id);
    if (e && !(e.tipo === "liga" && e.partidoId === propio)) return e.tipo === "reserva" ? "reserva" : "liga";
  }
  return "";
};
async function cargarSlots(a, b) {
  const m = new Map();
  (await getDocs(query(collection(db, "slots"), where("inicio", ">=", Timestamp.fromMillis(a)), where("inicio", "<", Timestamp.fromMillis(b))))).forEach((d) => m.set(d.id, d.data()));
  return m;
}
async function enviar(ops) {
  for (let i = 0; i < ops.length; i += 400) {
    const b = writeBatch(db);
    ops.slice(i, i + 400).forEach((o) => (o.del ? b.delete(o.del) : b.set(o.ref, o.datos)));
    await b.commit();
  }
}
function opsBloqueo(b, viejo) {
  const ops = [];
  const nuevosIds = new Set(b.estado === "activo" ? idsSlots(b.dianaId, [b.inicioMs, b.finMs]) : []);
  if (viejo && viejo.estado === "activo") for (const id of idsSlots(viejo.dianaId, [viejo.inicioMs, viejo.finMs])) if (!nuevosIds.has(id)) ops.push({ del: doc(db, "slots", id) });
  for (const id of nuevosIds) ops.push({ ref: doc(db, "slots", id), datos: { dianaId: b.dianaId, inicio: Timestamp.fromMillis(Number(id.split("_")[1])), uid: "liga", tipo: "liga", partidoId: b.id } });
  const resto = Object.assign({}, b);
  delete resto.id;
  ops.push({ ref: doc(db, "liga_bloqueos", b.id), datos: resto });
  return ops;
}
async function cargarBloqueos() {
  bloqueos = new Map();
  (await getDocs(collection(db, "liga_bloqueos"))).forEach((d) => bloqueos.set(d.id, { id: d.id, ...d.data() }));
  pintarBloqueos();

async function ajustarDuraciones(lista) {

    // primero los que se acortan (liberan huecos) y después los que se alargan
    const orden = lista.slice().sort((a, b) => ((a.iv[1] - a.iv[0]) - (a.b.finMs - a.b.inicioMs)) - ((b.iv[1] - b.iv[0]) - (b.b.finMs - b.b.inicioMs)));

    for (const x of orden) {
      const tramos = [];
      if (x.iv[0] < x.b.inicioMs) tramos.push([x.iv[0], x.b.inicioMs]);
      if (x.iv[1] > x.b.finMs) tramos.push([x.b.finMs, x.iv[1]]);
      let choca = "";
      for (const t of tramos) {
        const otro = [...bloqueos.values()].find((o) => o.id !== x.b.id && o.estado === "activo" && o.dianaId === x.b.dianaId && o.inicioMs < t[1] && t[0] < o.finMs && !hechos.some((h) => h.b.id === o.id && !(h.iv[0] < t[1] && t[0] < h.iv[1])));

        if (reservaEn(x.b.dianaId, t, await cargarSlots(t[0], t[1]))) { choca = "hay una reserva de cliente"; break; }
      }
      if (choca) { fallan.push(etiquetaBloque(x.b) + " (" + choca + ")"); continue; }
      ops.push(...opsBloqueo(Object.assign({}, x.b, { inicioMs: x.iv[0], finMs: x.iv[1], nota: notaManual(x.b) }), x.b));
      hechos.push(x);
    }
    if (ops.length) await enviar(ops);
    await cargarBloqueos();
    $("msg").textContent = "✔ Ajustados " + hechos.length + " bloqueos." + (fallan.length ? " No se pudieron alargar: " + fallan.join("; ") + ". Revísalos a mano." : "");

}

  $("edDiana").innerHTML = "";
  $("edInfo").textContent = b ? etiquetaPartido(b) : "";
  $("editor").classList.remove("oculto");
  edRevisar();
}
function edDatos() {
  const f = $("edFecha").value, h = $("edHora").value;
  if (!f || !h) return null;
  const [y, m, d] = f.split("-").map(Number), [hh, mi] = h.split(":").map(Number);
  return { pMs: new Date(y, m - 1, d, hh, mi).getTime(), cat: edit.modo === "nuevo" ? $("edCat").value : edit.b.categoria, nivel: edit.modo === "nuevo" ? Number($("edNivel").value) || 0 : edit.b.nivel };
}
async function edCalcular() {
  const x = edDatos();
  if (!x) return null;
  const iv = intervaloPara(x.cat, x.pMs, x.nivel);
  edMapa = await cargarSlots(iv[0] - 3 * 60 * MIN, iv[1] + 3 * 60 * MIN);
  const otros = [...bloqueos.values()].filter((b) => !edit.b || b.id !== edit.b.id);
  edOpciones = opcionesDiana(x.cat, x.pMs, x.nivel, otros, dianas, edMapa);
  return x;
}
const sirve = (o) => o.estado === "libre" || o.estado === "encadenar";
function textoOpcion(o) {
  const n = o.diana.nombre + (o.diana.online ? " · online" : "");
  if (o.estado === "libre") return n + " · libre";
  if (o.estado === "encadenar") return n + " · libre si se encadena con " + etiquetaBloque(o.socio.b);
  if (o.estado === "sinOnline") return n + " · sin online (no vale para equipos)";
  if (o.estado === "reserva") return n + " · ocupada por una reserva";
  return n + " · ocupada por " + etiquetaBloque(o.por);
}
async function edRevisar() {
  if (!(await edCalcular())) return;
  const prev = $("edDiana").value || (edit.b && edit.b.dianaId) || "";
  $("edDiana").innerHTML = "";
  for (const o of edOpciones) { const op = new Option(textoOpcion(o), o.diana.id); op.disabled = !sirve(o); $("edDiana").add(op); }
  const usables = edOpciones.filter(sirve);
  const elegida = usables.find((o) => o.diana.id === prev) || usables.find((o) => o.estado === "libre") || usables[0];
  if (elegida) $("edDiana").value = elegida.diana.id;
  edInfo();
}
function edInfo() {
  const o = edOpciones.find((x) => x.diana.id === $("edDiana").value);
  if (!o || !sirve(o)) { $("edInfo").textContent = "Ninguna diana sirve a esa hora. Prueba otra hora, o aplaza o mueve antes otra partida."; return; }
  let t;
  if (o.estado === "libre") t = "Se bloqueará de " + hhmm(o.iv[0]) + " a " + hhmm(o.iv[1]) + ". ✔ " + o.diana.nombre + " está libre.";
  else if (o.socio.b.categoria === "parejas") t = "⏰ Se encadena: " + etiquetaBloque(o.socio.b) + " tendrá que acabar a las " + hhmm(o.socio.iv[1]) + " y este partido irá de " + hhmm(o.iv[0]) + " a " + hhmm(o.iv[1]) + " en la " + o.diana.nombre + ". Avisa a los dos equipos.";
  else t = "⏰ Se encadena: este partido irá de " + hhmm(o.iv[0]) + " a " + hhmm(o.iv[1]) + " (tendrá que acabar a esa hora) y después va " + etiquetaBloque(o.socio.b) + " (" + hhmm(o.socio.iv[0]) + "–" + hhmm(o.socio.iv[1]) + "). Avisa a los dos equipos.";
  if (edit.b) {
    const nuevo = Object.assign({}, edit.b, { dianaId: o.diana.id, inicioMs: o.iv[0], finMs: o.iv[1], estado: "activo" });
    const extra = planCambios(edit.b, nuevo, o.socio || null, [...bloqueos.values()], edMapa).filter((c) => c.restaurado);
    if (extra.length) t += " Al quitarlo de su sitio, " + extra.map((c) => etiquetaBloque(c.nuevo) + " vuelve a su horario normal (" + hhmm(c.nuevo.inicioMs) + "–" + hhmm(c.nuevo.finMs) + ")").join("; ") + ".";
  }
  $("edInfo").textContent = t;
}
$("edFecha").onchange = edRevisar;
$("edHora").onchange = edRevisar;
$("edCat").onchange = edRevisar;
$("edNivel").onchange = edRevisar;
$("edDiana").onchange = edInfo;
$("edCancelar").onclick = () => { $("editor").classList.add("oculto"); edit = null; };
$("aniadir").onclick = () => { $("edNivel").value = ""; $("edLocal").value = ""; $("edVisitante").value = ""; abrirEditor("nuevo", null); };
$("edGuardar").onclick = async () => {
  const dianaId = $("edDiana").value;
  try {
    const x = await edCalcular();
    const o = edOpciones.find((z) => z.diana.id === dianaId);
    if (!x || !o || !sirve(o)) { $("edInfo").textContent = "Elige fecha, hora y una diana que sirva."; return; }
    const e = edit, nuevoM = e.modo === "nuevo";
    const b = { id: e.b ? e.b.id : "manual-" + Date.now(), origen: e.b ? e.b.origen : "manual", categoria: x.cat, nivel: nuevoM ? Number($("edNivel").value) || 0 : e.b.nivel,
      local: nuevoM ? $("edLocal").value.trim() : e.b.local, visitante: nuevoM ? $("edVisitante").value.trim() : e.b.visitante,
      dianaId: dianaId, partidoMs: x.pMs, inicioMs: o.iv[0], finMs: o.iv[1], estado: "activo", dia: iso(new Date(x.pMs)), nota: e.b ? notaManual(e.b) : "" };
    const extra = await aplicarPlan(planCambios(e.b || null, b, o.socio || null, [...bloqueos.values()], edMapa), b);
    $("editor").classList.add("oculto");
    edit = null;
    $("msg").textContent = "✔ Guardado: " + diaBonito(x.pMs) + " " + hhmm(x.pMs) + " · " + nombreDiana(dianaId) + " (" + hhmm(b.inicioMs) + "–" + hhmm(b.finMs) + ")." + textoAjustes(extra);
    revisarLiga();
  } catch (er) { $("edInfo").textContent = "Error: " + (er.code || er.message); }
};

// ---------- Cambios de horario que hace la liga ----------
async function revisarLiga() {
  const cont = $("cambiosLiga");
  const activos = [...bloqueos.values()].filter((b) => b.estado === "activo" && b.finMs >= Date.now() && b.origen !== "manual");
  try {
    const partidos = new Map();
    await Promise.all(activos.map(async (b) => { const s = await getDoc(doc(db, "liga_partidos", b.id)); if (s.exists()) partidos.set(b.id, s.data()); }));
    const cambiosAdmin = new Map();
    (await getDocs(query(collection(db, "liga_config"), where(documentId(), ">=", "cambio_"), where(documentId(), "<", "cambio`")))).forEach((d) => cambiosAdmin.set(d.id.slice(7), d.data()));
    const lista = cambiosDeLiga(activos, partidos, cambiosAdmin);
    cont.innerHTML = "";
    $("hCambios").classList.toggle("oculto", !lista.length);
    for (const x of lista) {
      const c = el("div", "", "card");
      c.append(el("strong", etiquetaBloque(x.b)));
      c.append(el("small", "La liga lo pone ahora el " + diaBonito(new Date(x.p.dia + "T12:00:00").getTime()) + " a las " + x.p.hora + "."));
      c.append(el("small", "Tu bloqueo: " + diaBonito(x.b.partidoMs) + " a las " + hhmm(x.b.partidoMs) + " · " + nombreDiana(x.b.dianaId) + (x.movidoPorTi ? " (lo habías movido tú)" : ""), "aviso"));
      const m = el("button", "Mover el bloqueo a la nueva hora");
      m.onclick = () => abrirEditor("cambiar", x.b, { dia: x.p.dia, hora: x.p.hora });
      const k = el("button", "Mantener mi horario", "sec");
      k.onclick = async () => {
        try { await setDoc(doc(db, "liga_config", "cambio_" + x.b.id), { estado: "movido", dia: x.b.dia, hora: hhmm(x.b.partidoMs), diaOriginal: x.p.dia, horaOriginal: x.p.hora }); revisarLiga(); }
        catch (e) { $("msg").textContent = "Error: " + (e.code || e.message); }
      };
      c.append(m, k);
      cont.append(c);
    }
  } catch (e) { cont.innerHTML = ""; }
}

// ---------- 1. Mis equipos ----------
async function cargarEquipos() {
  const [c, e] = await Promise.all([getDoc(doc(db, "liga_config", "equiposSweetDreams")), getDocs(query(collection(db, "liga_equipos"), where("categoria", "==", "equipos")))]);
  nombresSD = c.exists() ? c.data().nombres || [] : [];
  const todos = [...new Set([...e.docs.map((d) => d.data().nombre), ...nombresSD])].sort((a, b) => a.localeCompare(b));
  const lista = $("listaEq");
  lista.innerHTML = "";
  $("infoEq").textContent = todos.length ? "Marca los equipos de Sweet Dreams. Todos sus partidos, de local o de visitante, ocupan una diana tuya." : "Todavía no hay equipos de la liga online cargados. Aparecerán aquí cuando se publique el calendario nuevo.";
  $("guardarEq").classList.toggle("oculto", !todos.length);
  for (const n of todos) {
    const l = el("label", "", "eq");
    const i = document.createElement("input");
    i.type = "checkbox";
    i.value = n;
    i.checked = nombresSD.includes(n);
    l.append(i, el("span", n));
    lista.append(l);
  }
}
$("guardarEq").onclick = async () => {
  const nombres = [...document.querySelectorAll("#listaEq input:checked")].map((i) => i.value);
  try {
    await setDoc(doc(db, "liga_config", "equiposSweetDreams"), { nombres: nombres });
    nombresSD = nombres;
    $("msg").textContent = "✔ Guardados " + nombres.length + " equipos.";
  } catch (e) { $("msg").textContent = "Error: " + (e.code || e.message); }
};

// ---------- Abrir desde una solicitud de capitán (pantalla «Solicitudes de capitanes») ----------
let solicitudURL = null;
async function cerrarSolicitud(respuesta) {
  if (!solicitudURL) return;
  try {
    const { updateDoc, serverTimestamp } = await import("https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js");
    await updateDoc(doc(db, "cambios_pedidos", solicitudURL), { estado: "aprobada", respuesta: respuesta, resuelto: serverTimestamp(), por: auth.currentUser ? auth.currentUser.uid : "" });
    $("msg").textContent += " ✔ La solicitud del capitán queda aprobada.";
  } catch (e) { $("msg").textContent += " (No se pudo marcar la solicitud como aprobada: márcala en Solicitudes.)"; }
  solicitudURL = null;
}
async function procesarURL() {
  const q = new URLSearchParams(location.search), id = q.get("editar") || q.get("aplazar");
  if (!id) return;
  solicitudURL = q.get("sol");
  history.replaceState(null, "", location.pathname);
  let b = bloqueos.get(id);
  if (!b) {
    const s = await getDoc(doc(db, "liga_partidos", id));
    if (!s.exists()) { $("msg").textContent = "No encuentro ese partido en el calendario."; solicitudURL = null; return; }
    const p = s.data();
    b = { id: id, origen: "calendario", categoria: p.categoria, nivel: p.nivel, local: p.local, visitante: p.visitante, partidoMs: p.fecha.toMillis(), inicioMs: 0, finMs: 0, dianaId: "", estado: "sinBloqueo", dia: p.dia, nota: "" };
  }
  if (q.get("aplazar")) {
    if (b.estado !== "activo") { $("msg").textContent = "Ese partido no tiene ninguna diana bloqueada: apruébalo desde «Solicitudes de capitanes»."; solicitudURL = null; return; }
    await aplazar(b);
    if ($("msg").textContent.startsWith("✔ Diana liberada")) await cerrarSolicitud("Partido aplazado. Cuando tengáis fecha nueva, pedídmela desde aquí.");
    else solicitudURL = null;
    return;
  }
  abrirEditor(b.estado === "aplazado" ? "reprogramar" : "cambiar", b, q.get("dia") && q.get("hora") ? { dia: q.get("dia"), hora: q.get("hora") } : null);
  $("edTitulo").textContent += " · solicitud de capitán";
}
const guardarDelEditor = $("edGuardar").onclick;
$("edGuardar").onclick = async () => {
  await guardarDelEditor();
  if (solicitudURL && $("msg").textContent.startsWith("✔ Guardado: ")) await cerrarSolicitud("Hecho: " + $("msg").textContent.slice(12).split(").")[0] + "). Recordad avisar al otro equipo.");
};
$("edCancelar").addEventListener("click", () => { solicitudURL = null; });
const esperarCarga = setInterval(() => { if (!$("panel").classList.contains("oculto")) { clearInterval(esperarCarga); procesarURL(); } }, 200);
  
onAuthStateChanged(auth, async (u) => {
  $("panel").classList.add("oculto");
  if (!u) { $("estado").innerHTML = 'Primero inicia sesión en la <a href="./">app</a>.'; return; }
  try {
    const yo = await getDoc(doc(db, "users", u.uid));
    if (!yo.exists() || yo.data().role !== "admin") { $("estado").textContent = "No tienes permiso para ver esta página."; return; }
    dianas = (await getDocs(query(collection(db, "dartboards"), orderBy("orden")))).docs.map((d) => ({ id: d.id, ...d.data() })).filter((x) => x.activa);
    await cargarEquipos();
    await cargarBloqueos();
    revisarLiga();
    $("estado").textContent = "";
    $("panel").classList.remove("oculto");
  } catch (e) { $("estado").textContent = "Error: " + (e.code || e.message); }
});
</script>
