<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ofertas (administrador)</title>
<meta name="theme-color" content="#14213d">
<style>
body{font-family:system-ui,sans-serif;background:#14213d;color:#f1faee;margin:0;padding:20px;display:flex;justify-content:center}
main{width:100%;max-width:560px}
a{color:#ffd166}
h2{font-size:1.15rem;margin:28px 0 6px;color:#ffd166}
label{display:block;margin-top:14px;font-weight:700}
input,textarea,button{width:100%;padding:12px;font-size:1rem;border-radius:8px;border:1px solid #3d5380;background:#0f1a30;color:#f1faee;margin-top:6px;font-family:inherit}
textarea{min-height:110px}
input[type=checkbox]{width:22px;height:22px;margin:0}
.chk{display:flex;align-items:center;gap:10px;font-weight:400}
button{background:#ffd166;color:#14213d;font-weight:700;border:0;margin-top:14px}
button.sec{background:transparent;color:#f1faee;border:1px solid #3d5380}
button.mal{background:transparent;color:#ff8787;border:1px solid #ff8787}
.card{background:#1d2f52;border-radius:12px;padding:12px 14px;margin-top:10px}
.card img{width:100%;border-radius:8px;margin-top:8px}
.card small{display:block;opacity:.85;margin-top:3px}
.rol{display:inline-block;padding:2px 10px;border-radius:999px;background:#ffd166;color:#14213d;font-weight:700;font-size:.8rem;margin-right:6px}
#vista{max-width:100%;border-radius:8px;margin-top:8px}
#msg{min-height:1.4em;color:#ffd166}
.oculto{display:none!important}
</style></head>
<body><main>
<p><a href="ofertas.html">← Ofertas</a> · <a href="admin.html">Panel</a></p>
<h1>Ofertas (administrador)</h1>
<p id="estado">Cargando…</p>
<p id="msg" role="status"></p>
<div id="panel" class="oculto">
  <h2>Nueva oferta</h2>
  <label for="titulo">Título</label>
  <input id="titulo" maxlength="80">
  <label for="texto">Texto</label>
  <textarea id="texto" maxlength="600"></textarea>
  <label for="imagen">Cartel o imagen (opcional)</label>
  <input id="imagen" type="file" accept="image/*">
  <img id="vista" class="oculto" alt="">
  <label for="desde">Desde</label>
  <input id="desde" type="date">
  <label for="hasta">Hasta (déjalo vacío si no tiene fin)</label>
  <input id="hasta" type="date">
  <label class="chk"><input id="soloSocios" type="checkbox" checked> Solo para socios</label>
  <button id="publicar">Publicar oferta</button>

  <h2>Ofertas publicadas</h2>
  <div id="lista"></div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";
import { getFirestore, doc, collection, getDoc, getDocs, addDoc, updateDoc, deleteDoc, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";
const app = initializeApp({
  apiKey: "AIzaSyByyLDyO2f0AYGtzVgdL006DRT2AE0n7kw",
  authDomain: "sweet-dreams-darts.firebaseapp.com",
  projectId: "sweet-dreams-darts",
  storageBucket: "sweet-dreams-darts.firebasestorage.app",
  messagingSenderId: "232279000383",
  appId: "1:232279000383:web:f40d9ae65a4266f372bf8a"
});
const auth = getAuth(app);
const db = getFirestore(app);
const $ = (id) => document.getElementById(id);
const pad = (n) => String(n).padStart(2, "0");
const iso = (d) => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const el = (tag, txt, cls) => { const e = document.createElement(tag); if (txt) e.textContent = txt; if (cls) e.className = cls; return e; };
let imagenDatos = "";

function reducir(file) {
  return new Promise((ok, mal) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 900 / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * k);
      c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      let q = 0.72, d = c.toDataURL("image/jpeg", q);
      while (d.length > 420000 && q > 0.3) { q -= 0.1; d = c.toDataURL("image/jpeg", q); }
      ok(d);
    };
    img.onerror = () => mal(new Error("No se ha podido leer la imagen"));
    img.src = url;
  });
}

$("imagen").onchange = async () => {
  const f = $("imagen").files[0];
  imagenDatos = "";
  $("vista").classList.add("oculto");
  if (!f) return;
  try {
    imagenDatos = await reducir(f);
    $("vista").src = imagenDatos;
    $("vista").classList.remove("oculto");
    $("msg").textContent = "";
  } catch (e) { $("msg").textContent = e.message; }
};

$("publicar").onclick = async () => {
  const titulo = $("titulo").value.trim();
  if (!titulo) { $("msg").textContent = "Escribe un título."; return; }
  if ($("hasta").value && $("desde").value && $("hasta").value < $("desde").value) { $("msg").textContent = "La fecha final es anterior a la inicial."; return; }
  $("publicar").disabled = true;
  try {
    await addDoc(collection(db, "ofertas"), {
      titulo: titulo,
      texto: $("texto").value.trim(),
      imagen: imagenDatos,
      desde: $("desde").value || iso(new Date()),
      hasta: $("hasta").value || "",
      soloSocios: $("soloSocios").checked,
      activa: true,
      creado: serverTimestamp()
    });
    $("titulo").value = "";
    $("texto").value = "";
    $("imagen").value = "";
    $("hasta").value = "";
    imagenDatos = "";
    $("vista").classList.add("oculto");
    $("msg").textContent = "✔ Oferta publicada.";
    await cargar();
  } catch (e) { $("msg").textContent = "Error: " + (e.code || e.message); }
  $("publicar").disabled = false;
};

async function cargar() {
  const lista = $("lista");
  lista.innerHTML = "";
  const snap = await getDocs(query(collection(db, "ofertas"), orderBy("creado", "desc")));
  if (snap.empty) lista.append(el("p", "Todavía no hay ofertas."));
  snap.forEach((d) => {
    const o = d.data();
    const c = el("div", "", "card");
    const cab = el("div");
    cab.append(el("span", o.soloSocios ? "Solo socios" : "Todos", "rol"), el("span", o.activa ? "Activa" : "Desactivada", "rol"));
    c.append(cab, el("strong", o.titulo));
    c.append(el("small", "Desde " + o.desde + (o.hasta ? " hasta " + o.hasta : " · sin fecha de fin")));
    if (o.imagen) { const i = document.createElement("img"); i.src = o.imagen; i.alt = ""; c.append(i); }
    const a = el("button", o.activa ? "Desactivar" : "Activar", "sec");
    a.onclick = async () => { await updateDoc(doc(db, "ofertas", d.id), { activa: !o.activa }); cargar(); };
    const b = el("button", "Borrar", "mal");
    b.onclick = async () => { if (confirm("¿Borrar esta oferta?")) { await deleteDoc(doc(db, "ofertas", d.id)); cargar(); } };
    c.append(a, b);
    lista.append(c);
  });
}

onAuthStateChanged(auth, async (u) => {
  $("panel").classList.add("oculto");
  if (!u) { $("estado").innerHTML = 'Primero inicia sesión en la <a href="./">app</a>.'; return; }
  try {
    const yo = await getDoc(doc(db, "users", u.uid));
    if (!yo.exists() || yo.data().role !== "admin") { $("estado").textContent = "No tienes permiso para ver esta página."; return; }
    $("desde").value = iso(new Date());
    await cargar();
    $("estado").textContent = "";
    $("panel").classList.remove("oculto");
  } catch (e) { $("estado").textContent = "Error: " + (e.code || e.message); }
});
</script>
</main></body></html>
