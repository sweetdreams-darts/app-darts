<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cargar datos del bar</title>
<style>body{font-family:system-ui,sans-serif;background:#14213d;color:#f1faee;padding:20px;max-width:480px;margin:auto}button{width:100%;padding:13px;margin-top:14px;font-size:1rem;font-weight:700;border:0;border-radius:8px;background:#ffd166;color:#14213d}a{color:#ffd166}li{margin:6px 0}#msg{color:#ffd166}</style></head>
<body>
<p><a href="./">← Volver a la app</a></p>
<h1>Cargar datos del bar</h1>
<p id="msg">Cargando…</p>
<div id="panel" hidden>
  <p>Esto crea las 5 dianas, el horario del bar y las reglas de reserva (mínimo 30 min de antelación, máximo 14 días, tramos de 15 min). Si ya existen, los vuelve a escribir.</p>
  <button id="cargar">Cargar datos</button>
  <ul id="res"></ul>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";
import { getFirestore, doc, getDoc, getDocs, writeBatch, collection, query, orderBy } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";
const app = initializeApp({
  apiKey: "AIzaSyByyLDyO2f0AYGtzVgdL006DRT2AE0n7kw",
  authDomain: "sweet-dreams-darts.firebaseapp.com",
  projectId: "sweet-dreams-darts",
  storageBucket: "sweet-dreams-darts.firebasestorage.app",
  messagingSenderId: "232279000383",
  appId: "1:232279000383:web:f40d9ae65a4266f372bf8a"
});
const auth = getAuth(app);
const db = getFirestore(app);
const $ = (id) => document.getElementById(id);
const DIANAS = [
  ["g3-roja-izq", "G3 roja izquierda", "G3", "roja", "izquierda"],
  ["g3-roja-der", "G3 roja derecha", "G3", "roja", "derecha"],
  ["g3-negra-izq", "G3 negra izquierda", "G3", "negra", "izquierda"],
  ["g3-negra-der", "G3 negra derecha", "G3", "negra", "derecha"],
  ["g2-barra", "G2 junto a la barra", "G2", "", "junto a la barra"]
];
// Clave = día de la semana en que ABRE (0 = domingo ... 6 = sábado). Cierra en la madrugada siguiente.
const HORARIO = { 0: ["17:00", "03:00"], 1: ["17:00", "03:00"], 2: ["17:00", "03:00"], 3: ["17:00", "03:00"], 4: ["17:00", "04:00"], 5: ["17:00", "04:30"], 6: ["17:00", "04:30"] };

onAuthStateChanged(auth, async (u) => {
  $("panel").hidden = true;
  if (!u) { $("msg").innerHTML = 'Primero inicia sesión en la <a href="./">app</a>.'; return; }
  try {
    const yo = await getDoc(doc(db, "users", u.uid));
    if (!yo.exists() || yo.data().role !== "admin") { $("msg").textContent = "No tienes permiso para ver esta página."; return; }
    $("msg").textContent = "";
    $("panel").hidden = false;
  } catch (e) { $("msg").textContent = "Error: " + (e.code || e.message); }
});

$("cargar").onclick = async () => {
  $("cargar").disabled = true;
  $("res").innerHTML = "";
  try {
    const b = writeBatch(db);
    DIANAS.forEach((d, i) => b.set(doc(db, "dartboards", d[0]), { nombre: d[1], modelo: d[2], color: d[3], posicion: d[4], orden: i + 1, activa: true }));
    b.set(doc(db, "settings", "reservas"), { minAntelacionMin: 30, maxDiasAntelacion: 14, tramoMin: 15 });
    const dias = {};
    for (const k in HORARIO) dias[k] = { abre: HORARIO[k][0], cierra: HORARIO[k][1] };
    b.set(doc(db, "settings", "horario"), { zonaHoraria: "Europe/Madrid", dias: dias, vispera: { abre: "17:00", cierra: "04:30" } });
    await b.commit();
    const snap = await getDocs(query(collection(db, "dartboards"), orderBy("orden")));
    const t = document.createElement("li");
    t.textContent = "✔ Hecho. Dianas guardadas: " + snap.size + ", más el horario y las reglas de reserva.";
    $("res").append(t);
    snap.forEach((d) => {
      const li = document.createElement("li");
      li.textContent = d.data().orden + ". " + d.data().nombre;
      $("res").append(li);
    });
  } catch (e) {
    const li = document.createElement("li");
    li.textContent = "✘ No se pudo guardar: " + (e.code || e.message);
    $("res").append(li);
  }
  $("cargar").disabled = false;
};
</script>
</body></html>
