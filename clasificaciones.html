<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";
const app = initializeApp({
  apiKey: "AIzaSyByyLDyO2f0AYGtzVgdL006DRT2AE0n7kw",
  authDomain: "sweet-dreams-darts.firebaseapp.com",
  projectId: "sweet-dreams-darts",
  storageBucket: "sweet-dreams-darts.firebasestorage.app",
  messagingSenderId: "232279000383",
  appId: "1:232279000383:web:f40d9ae65a4266f372bf8a"
});
const auth = getAuth(app);
const db = getFirestore(app);
const $ = (id) => document.getElementById(id);
const el = (tag, txt, cls) => { const e = document.createElement(tag); if (txt !== undefined && txt !== null && txt !== "") e.textContent = txt; if (cls) e.className = cls; return e; };

// <logica>
const sinTildes = (s) => String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "");
const clave = (s) => sinTildes(s).toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
const TIPOS = {
  x: { nombre: "501", media: "PPD", idx: { pj: 3, pg: 4, hats: 5, d3: 6, t80: 7, ht: 8, lt: 9, do6: 10, do7: 11, do8: 12, do9: 13 },
       cols: [["pj", "PJ"], ["pg", "PG"], ["pct", "%V"], ["hats", "Hats"], ["d3", "3BD"], ["t80", "T80"], ["ht", "HTon"], ["lt", "LTon"], ["do6", "6DO"], ["do7", "7DO"], ["do8", "8DO"], ["do9", "9DO"]] },
  c: { nombre: "Cricket", media: "MPR", idx: { pj: 3, pg: 4, asist: 5, hats: 6, wh: 7, m5: 8, m6: 9, m7: 10, m8: 11, m9: 12 },
       cols: [["pj", "PJ"], ["pg", "PG"], ["pct", "%V"], ["asist", "Asist."], ["hats", "Hats"], ["wh", "WHorse"], ["m5", "5MR"], ["m6", "6MR"], ["m7", "7MR"], ["m8", "8MR"], ["m9", "9MR"]] }
};
const SUMABLES = { x: ["pg", "hats", "d3", "t80", "ht", "lt", "do6", "do7", "do8", "do9"], c: ["pg", "asist", "hats", "wh", "m5", "m6", "m7", "m8", "m9"] };

// Una fila por jugador y nivel, tal como viene en el PDF.
function entradasDe(niveles, tipo) {
  const T = TIPOS[tipo], out = [];
  for (const n of niveles || []) {
    const filas = (tipo === "x" ? n.x01 : n.cri) || [], sdEq = new Set(n.sd || []);
    for (const f of filas) {
      const v = { media: f[2] };
      for (const id in T.idx) v[id] = f[T.idx[id]];
      v.pct = v.pj ? Math.round((v.pg / v.pj) * 1000) / 10 : 0;
      out.push({ k: clave(f[0]), nombre: f[0], equipo: f[1], cat: n.cat, n: n.n, sd: sdEq.has(clave(f[1])), v: v, clv: clave(f[0]) + "|" + n.cat + "|" + n.n });
    }
  }
  return out;
}
const filaDe = (e) => ({ k: e.k, nombre: e.nombre, equipo: e.equipo, niveles: [e.n], cat: e.cat, sd: e.sd, v: e.v, entradas: [e], id: e.clv });
// Un jugador en varios niveles = una sola fila en General: media simple de sus niveles (o ponderada si se pide) y contadores sumados.
function agregar(entradas, tipo, ponderar) {
  const por = new Map();
  for (const e of entradas) { if (!por.has(e.k)) por.set(e.k, []); por.get(e.k).push(e); }
  return [...por.values()].map((es) => {
    const pj = es.reduce((a, e) => a + (e.v.pj || 0), 0);
    const media = ponderar && pj > 0 ? es.reduce((a, e) => a + e.v.media * (e.v.pj || 0), 0) / pj : es.reduce((a, e) => a + e.v.media, 0) / es.length;
    const v = { media: Math.round((media + 1e-9) * 100) / 100, pj: pj };
    for (const c of SUMABLES[tipo]) v[c] = es.reduce((a, e) => a + (e.v[c] || 0), 0);
    v.pct = pj ? Math.round((v.pg / pj) * 1000) / 10 : 0;
    const eqs = [...new Set(es.map((e) => e.equipo))];
    return { k: es[0].k, nombre: es.map((e) => e.nombre).sort((a, b) => b.length - a.length)[0], equipo: eqs.join(" / "), niveles: [...new Set(es.map((e) => e.n))].sort((a, b) => a - b), cat: "general", sd: es.some((e) => e.sd), v: v, entradas: es, id: es[0].k };
  });
}
// Puestos oficiales: por media (y, a igualdad, más partidas). Empate exacto = mismo puesto.
function puestos(filas) {
  const ord = filas.slice().sort((a, b) => b.v.media - a.v.media || b.v.pj - a.v.pj || a.nombre.localeCompare(b.nombre));
  const m = new Map();
  ord.forEach((f, i) => { const ant = ord[i - 1]; m.set(f, ant && ant.v.media === f.v.media && ant.v.pj === f.v.pj ? m.get(ant) : i + 1); });
  return m;
}
function ordenar(filas, col, dir) {
  const val = (f) => (col === "nombre" ? sinTildes(f.nombre).toLowerCase() : col === "equipo" ? sinTildes(f.equipo).toLowerCase() : f.v[col]);
  return filas.slice().sort((a, b) => { const x = val(a), y = val(b); return (typeof x === "string" ? x.localeCompare(y) : x - y) * dir || b.v.media - a.v.media || b.v.pj - a.v.pj; });
}
// Valores de la semana anterior, a partir del historial: { "clave|cat|n": {x:[[fecha,media,pj]…], c:[…]} }
function fechasHist(hist) {
  const s = new Set();
  for (const k in (hist && hist.h) || {}) for (const t of ["x", "c"]) for (const p of hist.h[k][t] || []) s.add(p[0]);
  return [...s].sort();
}
function entradasPrevias(hist, tipo, nivelesActuales) {
  const fechas = fechasHist(hist);
  if (fechas.length < 2) return [];
  const ant = fechas[fechas.length - 2], out = [];
  const nombres = new Map();
  for (const e of entradasDe(nivelesActuales, tipo)) nombres.set(e.clv, e);
  for (const clv in hist.h) {
    const serie = (hist.h[clv][tipo] || []).filter((p) => p[0] <= ant);
    const e = nombres.get(clv);
    if (!serie.length || !e) continue;
    const p = serie[serie.length - 1];
    out.push(Object.assign({}, e, { v: Object.assign({}, e.v, { media: p[1], pj: p[2] }) }));
  }
  return out;
}
// Cambio de puesto: positivo = sube. Se compara solo entre quienes ya estaban la semana pasada.
function cambios(filasActuales, filasPrevias) {
  const prev = new Map(filasPrevias.map((f) => [f.id, f]));
  const comunes = filasActuales.filter((f) => prev.has(f.id));
  const pAct = puestos(comunes), pAnt = puestos(comunes.map((f) => prev.get(f.id)));
  const res = new Map();
  for (const f of filasActuales) {
    if (!prev.has(f.id)) { res.set(f, "nuevo"); continue; }
    res.set(f, pAnt.get(prev.get(f.id)) - pAct.get(f));
  }
  return res;
}
// ¿Qué jugador de la liga es esta cuenta? Coincidencia automática por nombre; lo demás son candidatos para que el bar decida.
const PARTICULAS = new Set(["de", "del", "la", "las", "los", "el"]);
function buscarJugador(nombreCuenta, jugadores) {
  const k = clave(nombreCuenta);
  if (!k) return { estado: "nada", candidatos: [] };
  const claves = [...new Set(jugadores.map((j) => j.k))];
  if (claves.includes(k)) return { estado: "auto", k: k };
  const pref = claves.filter((c) => (c.length >= 26 && k.startsWith(c)) || (k.length >= 26 && c.startsWith(k)));
  if (pref.length === 1) return { estado: "auto", k: pref[0] };
  const orden = (s) => s.split(" ").sort().join(" ");
  const iguales = claves.filter((c) => orden(c) === orden(k));
  if (iguales.length === 1) return { estado: "auto", k: iguales[0] };
  const toks = (s) => new Set(s.split(" ").filter((t) => t && !PARTICULAS.has(t)));
  const mios = toks(k), cand = [];
  for (const c of claves) {
    const t = toks(c), comun = [...mios].filter((x) => t.has(x)).length;
    if (comun >= 2 && comun / Math.max(mios.size, t.size) >= 0.6) cand.push({ k: c, comun: comun });
  }
  cand.sort((a, b) => b.comun - a.comun);
  return { estado: cand.length ? "dudoso" : "nada", candidatos: cand.slice(0, 5).map((c) => c.k) };
}
// </logica>

const NIVEL_TXT = (n) => "N" + n;
const fmt = (x, d) => (typeof x === "number" ? (d === undefined ? (Number.isInteger(x) ? String(x) : x.toFixed(2)) : x.toFixed(d)) : x);
const fechaCorta = (iso) => { const [y, m, d] = iso.split("-").map(Number); return d + " " + ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"][m - 1]; };
const fechaLarga = (iso) => { const [y, m, d] = iso.split("-").map(Number); return d + " de " + ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"][m - 1] + " de " + y; };
const TEMP_TXT = (t) => (t[0] === "I" ? "Invierno " + t.slice(1) + "/" + String(Number(t.slice(1)) + 1).slice(2) : "Primavera " + t.slice(1));

let datos = null, hist = null, miNombre = "", yo = { estado: "nada", k: "", candidatos: [] }, PONDERAR = false;
const est = { vista: "general", tipo: "x", sub: "jug", nivel: "todos", sd: false, q: "", col: "media", dir: -1 };
let cacheFilas = [];

function poblacion() {
  const niv = datos.niveles.filter((n) => (est.vista === "general" ? true : n.cat === est.vista) && (est.nivel === "todos" || String(n.n) === String(est.nivel)));
  const ent = entradasDe(niv, est.tipo);
  return est.vista === "general" ? agregar(ent, est.tipo, PONDERAR) : ent.map(filaDe);
}
function previas() {
  if (!hist) return [];
  const niv = datos.niveles.filter((n) => (est.vista === "general" ? true : n.cat === est.vista) && (est.nivel === "todos" || String(n.n) === String(est.nivel)));
  const ent = entradasPrevias(hist, est.tipo, niv);
  return est.vista === "general" ? agregar(ent, est.tipo, PONDERAR) : ent.map(filaDe);
}
const fAbs = (f) => f.id;

function pintarAvance() {
  const flecha = (c) => (c === "nuevo" ? '<span class="fla nuevo">nuevo</span>' : c > 0 ? '<span class="fla sube">▲ ' + c + "</span>" : c < 0 ? '<span class="fla baja">▼ ' + -c + "</span>" : '<span class="fla igual">=</span>');
  return flecha;
}

function render() {
  const T = TIPOS[est.tipo];
  // pestañas
  document.querySelectorAll("#tabsVista button").forEach((b) => b.classList.toggle("act", b.dataset.v === est.vista));
  document.querySelectorAll("#tabsTipo button").forEach((b) => b.classList.toggle("act", b.dataset.t === est.tipo));
  document.querySelectorAll("#tabsSub button").forEach((b) => b.classList.toggle("act", b.dataset.s === est.sub));
  $("tabsSub").classList.toggle("oculto", est.vista === "general");
  $("tabsTipo").classList.toggle("oculto", est.vista !== "general" && est.sub === "eq");
  $("chipSD").classList.toggle("act", est.sd);
  // niveles disponibles para esta pestaña
  const nivs = datos.niveles.filter((n) => est.vista === "general" || n.cat === est.vista).map((n) => n.n);
  const sel = $("nivel");
  const valorPrevio = est.nivel;
  sel.innerHTML = "";
  if (est.vista !== "general") {
    sel.add(new Option("Todos los niveles", "todos"));
    [...new Set(nivs)].sort((a, b) => a - b).forEach((n) => sel.add(new Option("Nivel " + n, String(n))));
    sel.value = [...sel.options].some((o) => o.value === String(valorPrevio)) ? String(valorPrevio) : "todos";
    est.nivel = sel.value;
    sel.classList.remove("oculto");
  } else { est.nivel = "todos"; sel.classList.add("oculto"); }
  if (est.vista !== "general" && est.sub === "eq") return pintarEquipos();
  // jugadores
  const todas = poblacion(), pos = puestos(todas);
  const prev = previas(), flechas = prev.length ? cambios(todas, prev) : null;
  const q = clave(est.q);
  let filas = todas.filter((f) => (!est.sd || f.sd) && (!q || clave(f.nombre).includes(q) || clave(f.equipo).includes(q)));
  cacheFilas = todas;

function pintarEquipos() {

    tabla.append(cab);

    const vistos = new Set(), ul = el("ul", "", "res");
    (n.ultimos || []).slice().sort((a, b) => b.f.localeCompare(a.f)).forEach((r) => {
      const k = [r.e, r.c].sort().join("|") + r.f;

      li.append(el("span", (gano ? r.e : r.c) + " " + (gano ? r.pg + " – " + (r.pj - r.pg) : (r.pj - r.pg) + " – " + r.pg) + " " + (gano ? r.c : r.e)), el("span", fechaCorta(r.f) + " · J" + r.s));

function sparkline(serie, color) {
  if (serie.length < 2) return '<p class="nota">La gráfica aparecerá cuando haya al menos dos semanas de datos.</p>';
  const W = 300, H = 70, pad = 8, v = serie.map((p) => p[1]), min = Math.min(...v), max = Math.max(...v), rg = max - min || 1;
  const pts = serie.map((p, i) => [pad + (i * (W - 2 * pad)) / (serie.length - 1), H - pad - ((p[1] - min) / rg) * (H - 2 * pad)]);
  const linea = pts.map((p) => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
  return '<svg class="graf" viewBox="0 0 ' + W + " " + H + '" preserveAspectRatio="none"><polyline fill="none" stroke="' + color + '" stroke-width="2.5" points="' + linea + '"/>' + pts.map((p, i) => '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="3.2" fill="' + color + '"/>').join("") + '</svg><p class="nota" style="margin:2px 0 0">' + fechaCorta(serie[0][0]) + ": " + fmt(serie[0][1], 2) + " → " + fechaCorta(serie[serie.length - 1][0]) + ": " + fmt(serie[serie.length - 1][1], 2) + "</p>";
}
function abrirPerfil(k) {
  const caja = $("caja");
  caja.innerHTML = "";
  const todasX = entradasDe(datos.niveles, "x").filter((e) => e.k === k), todasC = entradasDe(datos.niveles, "c").filter((e) => e.k === k);
  const todas = todasX.concat(todasC);
  if (!todas.length) return;
  const nombre = todas.map((e) => e.nombre).sort((a, b) => b.length - a.length)[0];
  const cerrar = el("button", "Cerrar", "cerrar");
  cerrar.onclick = cerrarPerfil;
  const eqs = [...new Set(todas.map((e) => e.equipo))], nivs = [...new Set(todas.map((e) => e.n))].sort((a, b) => a - b);
  caja.append(cerrar, el("h2", nombre + (k === yo.k ? " (tú)" : "")), el("p", eqs.join(" / ") + " · " + nivs.map((n) => "Nivel " + n).join(", ") + (todas.some((e) => e.sd) ? " · ⭐ Sweet Dreams" : ""), "sub"));
  for (const tipo of ["x", "c"]) {
    const mias = tipo === "x" ? todasX : todasC;
    if (!mias.length) continue;
    const T = TIPOS[tipo];
    const entTipo = entradasDe(datos.niveles, tipo), gen = agregar(entTipo, tipo, PONDERAR), pg = puestos(gen), yoGen = gen.find((f) => f.k === k);
    const mod = el("div", "", "mod");
    mod.append(el("h4", T.nombre));
    const cif = el("div", "", "cifras");
    const c1 = (b, s) => { const d = el("div", "", "cif"); d.append(el("b", String(b)), el("span", s)); return d; };
    cif.append(c1(fmt(yoGen.v.media, 2), T.media + (mias.length > 1 ? " · media simple de " + mias.length + " niveles" : "")), c1("#" + pg.get(yoGen), "puesto general de " + gen.length), c1(yoGen.v.pj, "partidas"), c1(Math.round(yoGen.v.pct) + "%", "victorias"));
    mod.append(cif);
    const lin = el("div", "", "lineas");
    mias.slice().sort((a, b) => a.n - b.n).forEach((e) => {
      const pobl = entTipo.filter((x) => x.cat === e.cat && x.n === e.n).map(filaDe), pn = puestos(pobl);
      const f = pobl.find((x) => x.id === e.clv);
      lin.append(el("div", "Nivel " + e.n + " · " + e.equipo + ": " + T.media + " " + fmt(e.v.media, 2) + " · puesto #" + pn.get(f) + " de " + pobl.length + " · " + e.v.pj + " partidas · " + e.v.pg + " ganadas"));
    });
    if (mias.length > 1) lin.append(el("div", "Media simple de todos los niveles: " + T.media + " " + fmt(yoGen.v.media, 2), "total"));
    mod.append(lin);
    const rej = el("div", "", "rejilla");
    T.cols.filter(([id]) => !["pj", "pg", "pct"].includes(id)).forEach(([id, txt]) => { const d = el("div", "", yoGen.v[id] ? "" : "cero"); d.append(el("b", String(yoGen.v[id] || 0)), document.createTextNode(txt)); rej.append(d); });
    mod.append(rej);
    // evolución
    const series = mias.map((e) => ((hist && hist.h && hist.h[e.clv] && hist.h[e.clv][tipo]) || [])).sort((a, b) => b.length - a.length);
    mod.insertAdjacentHTML("beforeend", "<h4 style='margin-top:12px;font-size:.85rem'>Evolución de la media</h4>" + sparkline(series[0] || [], tipo === "x" ? "#ff2bd6" : "#19f2ff"));
    caja.append(mod);
  }
  $("hoja").classList.remove("oculto");
  caja.scrollTop = 0;
}

async function leerJson(ruta) {
  const clave = "sd_clasif_" + ruta;
  try { const c = JSON.parse(sessionStorage.getItem(clave) || "null"); if (c && Date.now() - c.t < 600000) return c.d; } catch (e) {}
  const s = await getDoc(doc(db, "liga_config", ruta));
  const d = s.exists() && s.data().datos ? { datos: JSON.parse(s.data().datos), generado: s.data().generado || "" } : null;
  if (d) { try { sessionStorage.setItem(clave, JSON.stringify({ t: Date.now(), d: d })); } catch (e) {} }
  return d;
}

onAuthStateChanged(auth, async (u) => {
  $("app").classList.add("oculto");
  if (!u) { $("estado").innerHTML = 'Primero inicia sesión en la <a href="./">app</a>.'; return; }
  try {
    const f = await getDoc(doc(db, "users", u.uid));
    const rol = f.exists() ? f.data().role : "";
    if (rol !== "player" && rol !== "admin") { $("estado").textContent = "Esta zona es solo para jugadores oficiales de la liga."; return; }
    miNombre = f.data().nombre || "";
    const [c, h] = await Promise.all([leerJson("clasificaciones"), leerJson("historial")]);
    if (!c) { $("estado").textContent = "Todavía no hay clasificaciones cargadas. Vuelve más tarde."; return; }

  } catch (e) { $("estado").textContent = "Error: " + (e.code || e.message); }
});
