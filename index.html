<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sweet Dreams Darts</title>
  <meta name="theme-color" content="#14213d">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Darts">
  <style>
    body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center;
           justify-content:center; gap:14px; padding:24px; box-sizing:border-box;
           background:#14213d; color:#f1faee; font-family:system-ui,sans-serif; text-align:center; }
    h1 { margin:0; font-size:1.8rem; }
    p { margin:0; font-size:1.1rem; max-width:32ch; }
    .ok { color:#ffd166; font-weight:700; }
  </style>
</head>
<body>
  <h1>Sweet Dreams Darts</h1>
  <p class="ok">Página de prueba funcionando</p>
  <p id="modo">Comprobando…</p>
  <p>Versión de prueba 0.1</p>
  <script>
    const instalada = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
    document.getElementById("modo").textContent = instalada
      ? "Estás usando la app instalada ✔"
      : "Ahora mismo estás en el navegador (aún no instalada)";
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
  </script>
</body>
</html>
