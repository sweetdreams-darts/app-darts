<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Zona Liga</title>
<meta name="theme-color" content="#14213d">
<style>
body{font-family:system-ui,sans-serif;background:#14213d;color:#f1faee;margin:0;padding:20px;display:flex;justify-content:center}
main{width:100%;max-width:520px}
a{color:#ffd166}
select,input,button{width:100%;padding:12px;font-size:1rem;border-radius:8px;border:1px solid #3d5380;background:#0f1a30;color:#f1faee;margin-top:10px}
.tabs{display:flex;gap:8px}
.tabs button{margin-top:0;font-weight:700}
.tabs button.sel{background:#ffd166;color:#14213d;border-color:#ffd166}
.fila{display:flex;gap:8px}
.chk{display:flex;align-items:center;gap:8px;margin-top:12px}
.chk input{width:auto;margin:0}
h2{font-size:1.05rem;margin:22px 0 0;color:#ffd166}
.card{background:#1d2f52;border-radius:12px;padding:12px 14px;margin-top:8px}
.card small{display:block;opacity:.8;margin-top:3px}
.sd{display:inline-block;margin-top:6px;padding:2px 10px;border-radius:999px;background:#ffd166;color:#14213d;font-weight:700;font-size:.8rem}
a.mapa{display:block;margin-top:10px;padding:11px;border-radius:8px;background:#ffd166;color:#14213d;font-weight:700;text-align:center;text-decoration:none}
.oculto{display:none!important}
</style></head>
<body><main>
<p><a href="./">← Volver a la app</a></p>
<h1>Zona Liga</h1>
<p id="estado">Cargando…</p>
<div id="panel" class="oculto">
  <div class="tabs"><button id="tCal" class="sel">Calendarios</button><button id="tLoc">Locales</button></div>
  <section id="vCal">
    <div class="fila"><select id="cat"><option value="parejas">Parejas</option><option value="equipos">Equipos (online)</option></select><select id="niv"></select></div>
    <label class="chk" id="chkSD"><input type="checkbox" id="soloSD"> Solo partidos en Sweet Dreams</label>
    <p id="info"></p>
    <div id="partidos"></div>
  </section>
  <section id="vLoc" class="oculto">
    <input id="buscar" type="search" placeholder="Buscar local">
    <div id="locales"></div>
  </section>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";
import { getFirestore, doc, getDoc, getDocs, collection, query, where } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";
const app = initializeApp({
  apiKey: "AIzaSyByyLDyO2f0AYGtzVgdL006DRT2AE0n7kw",
  authDomain: "sweet-dreams-darts.firebaseapp.com",
  projectId: "sweet-dreams-darts",
  storageBucket: "sweet-dreams-darts.firebasestorage.app",
  messagingSenderId: "232279000383",
  appId: "1:232279000383:web:f40d9ae65a4266f372bf8a"
});
const auth = getAuth(app);
const db = getFirestore(app);
const $ = (id) => document.getElementById(id);
const NIVELES = { parejas: 13, equipos: 10 };
const DIAS = ["dom", "lun", "mar", "mié", "jue", "vie", "sáb"];
const MESES = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
const el = (tag, txt, cls) => { const e = document.createElement(tag); if (txt) e.textContent = txt; if (cls) e.className = cls; return e; };
let datos = [], locales = [], localesCargados = false;

function fechaBonita(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  return DIAS[new Date(y, m - 1, d).getDay()] + " " + d + " " + MESES[m - 1];
}
function nombreTemporada(t) {
  const y = Number(t.slice(1));
  return t[0] === "I" ? "Invierno " + y + "/" + String(y + 1).slice(2) : "Primavera " + y;
}
function llenarNiveles() {
  $("niv").innerHTML = "";
  for (let i = 1; i <= NIVELES[$("cat").value]; i++) $("niv").add(new Option("Nivel " + i, i));
  $("chkSD").classList.toggle("oculto", $("cat").value !== "parejas");
}

async function cargarPartidos() {
  $("info").textContent = "Cargando…";
  $("partidos").innerHTML = "";
  try {
    const q = query(collection(db, "liga_partidos"), where("categoria", "==", $("cat").value), where("nivel", "==", Number($("niv").value)));
    datos = (await getDocs(q)).docs.map((d) => d.data());
    pintarPartidos();
  } catch (e) { $("info").textContent = "Error: " + (e.code || e.message); }
}

function pintarPartidos() {
  const cont = $("partidos");
  cont.innerHTML = "";
  if (!datos.length) { $("info").textContent = "Todavía no hay calendario publicado para este nivel."; return; }
  const ult = datos.reduce((a, b) => (a.fecha.toMillis() >= b.fecha.toMillis() ? a : b)).temporada;
  const sd = $("cat").value === "parejas" && $("soloSD").checked;
  const lista = datos.filter((x) => x.temporada === ult && (!sd || x.enSweetDreams)).sort((a, b) => a.fecha.toMillis() - b.fecha.toMillis());
  $("info").textContent = nombreTemporada(ult) + " · " + lista.length + " partidos";
  let ultimo = "";
  for (const p of lista) {
    const clave = p.jornada + "|" + p.dia;
    if (clave !== ultimo) { cont.append(el("h2", "Jornada " + p.jornada + " · " + fechaBonita(p.dia) + " · " + p.hora)); ultimo = clave; }
    const c = el("div", "", "card");
    c.append(el("strong", p.local + " – " + p.visitante));
    if (p.sede) c.append(el("small", "Sede: " + p.sede));
    if (p.nota) c.append(el("small", p.nota));
    if (p.enSweetDreams) c.append(el("span", "En Sweet Dreams", "sd"));
    cont.append(c);
  }
}

async function cargarLocales() {
  if (localesCargados) return;
  try {
    locales = (await getDocs(collection(db, "liga_locales"))).docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => a.nombre.localeCompare(b.nombre));
    localesCargados = true;
    pintarLocales();
  } catch (e) { $("locales").textContent = "Error: " + (e.code || e.message); }
}

function pintarLocales() {
  const t = $("buscar").value.trim().toLowerCase();
  const cont = $("locales");
  cont.innerHTML = "";
  if (!locales.length) { cont.append(el("p", "Todavía no hay locales cargados.")); return; }
  for (const l of locales) {
    if (t && !(l.nombre + " " + l.direccion + " " + l.ciudad).toLowerCase().includes(t)) continue;
    const c = el("div", "", "card");
    c.append(el("strong", l.nombre));
    c.append(el("small", l.direccion + ", " + l.ciudad));
    c.append(el("small", (l.niveles || []).map((n) => { const [k, v] = n.split("-"); return (k === "parejas" ? "Parejas " : "Equipos ") + v; }).join(" · ")));
    const a = el("a", "Abrir en Google Maps", "mapa");
    a.href = l.mapsManual || l.mapsAuto;
    a.target = "_blank";
    a.rel = "noopener";
    c.append(a);
    cont.append(c);
  }
}

function pestana(cal) {
  $("vCal").classList.toggle("oculto", !cal);
  $("vLoc").classList.toggle("oculto", cal);
  $("tCal").classList.toggle("sel", cal);
  $("tLoc").classList.toggle("sel", !cal);
  if (!cal) cargarLocales();
}
$("tCal").onclick = () => pestana(true);
$("tLoc").onclick = () => pestana(false);
$("cat").onchange = () => { llenarNiveles(); cargarPartidos(); };
$("niv").onchange = cargarPartidos;
$("soloSD").onchange = pintarPartidos;
$("buscar").oninput = pintarLocales;

onAuthStateChanged(auth, async (u) => {
  $("panel").classList.add("oculto");
  if (!u) { $("estado").innerHTML = 'Primero inicia sesión en la <a href="./">app</a>.'; return; }
  try {
    const yo = await getDoc(doc(db, "users", u.uid));
    if (!yo.exists() || !["player", "admin"].includes(yo.data().role)) { $("estado").textContent = "La Zona Liga es solo para jugadores oficiales acreditados por el bar."; return; }
    $("estado").textContent = "";
    $("panel").classList.remove("oculto");
    llenarNiveles();
    cargarPartidos();
  } catch (e) { $("estado").textContent = "Error: " + (e.code || e.message); }
});
</script>
</main></body></html>
