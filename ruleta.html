<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ruleta de socios</title>
<meta name="theme-color" content="#0a0612">
<link rel="stylesheet" href="estilo.css">
<style>
body{margin:0;padding:20px;display:flex;justify-content:center}
main{width:100%;max-width:480px}
.caja{position:relative;width:320px;max-width:92%;margin:18px auto}
#rueda{width:100%;height:auto;display:block;border-radius:50%;box-shadow:0 0 24px rgba(255,43,214,.55),0 0 50px rgba(25,242,255,.25);transition:transform 5.5s cubic-bezier(.12,.7,.1,1)}
.puntero{position:absolute;top:-14px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:26px solid #ffe14d;filter:drop-shadow(0 0 8px rgba(255,225,77,.8));z-index:2}
button.grande{width:100%;padding:16px;font-size:1.2rem;margin-top:10px}
.premio{text-align:center;padding:16px;margin-top:16px}
.premio .nombre{font-family:"Bungee","Rubik",sans-serif;font-size:1.5rem;color:var(--amarillo);text-shadow:0 0 12px rgba(255,225,77,.6);margin:6px 0}
.premio .canjear{margin-top:12px}
.premio .hecho{margin-top:12px;padding:14px;border-radius:14px;border:2px solid #5dff9a;background:rgba(93,255,154,.14);color:#5dff9a;font-family:"Bungee","Rubik",sans-serif;font-size:1.5rem}
.premio .peq{font-size:.85rem;opacity:.85;margin-top:8px}
.espera .icono{font-size:4rem;margin:6px 0}
.latido{animation:latido 1.2s ease-in-out infinite}
@keyframes latido{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.espera .tit{font-family:"Bungee","Rubik",sans-serif;font-size:1.15rem;color:#19f2ff;margin:4px 0 10px}
.espera ol{text-align:left;margin:0 0 6px;padding-left:22px;font-size:.92rem}
.espera li{margin:7px 0}
.espera .alerta{margin:10px 0 0;padding:10px;border-radius:12px;border:1.5px solid #ffe14d;color:#ffe14d;font-weight:700;font-size:.92rem}
.espera button{margin-top:10px}
.oculto{display:none!important}
</style></head>
<body><main>
<p><a href="ofertas.html">← Ofertas</a></p>
<header class="marca"><h1>Ruleta</h1></header>
<p id="estado">Cargando…</p>
<div id="panel" class="oculto">
  <div class="caja"><div class="puntero"></div><canvas id="rueda" width="600" height="600"></canvas></div>
  <button id="girar" class="pri grande" type="button">¡Girar la ruleta!</button>
  <p id="aviso" style="text-align:center;opacity:.85">Solo puedes girar una vez. Si te toca premio, lo canjeas en la barra cuando quieras.</p>
  <div id="premio" class="zona premio oculto"></div>
  <p id="msg" role="status"></p>
</div>
<script>
window.addEventListener("error", function (e) {
  var s = document.getElementById("estado");
  if (s) s.textContent = "Error en la página: " + e.message + " (línea " + e.lineno + ")";
});
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";
const app = initializeApp({
  apiKey: "AIzaSyByyLDyO2f0AYGtzVgdL006DRT2AE0n7kw",
  authDomain: "sweet-dreams-darts.firebaseapp.com",
  projectId: "sweet-dreams-darts",
  storageBucket: "sweet-dreams-darts.firebasestorage.app",
  messagingSenderId: "232279000383",
  appId: "1:232279000383:web:f40d9ae65a4266f372bf8a"
});
const auth = getAuth(app);
const db = getFirestore(app);
const $ = (id) => document.getElementById(id);
const COLORES = ["#ff2bd6", "#19f2ff", "#ffe14d", "#8b5cff", "#5dff9a", "#ff5c7a"];
let usuario = null, config = null, premios = [], espera = null;

// <logica>
// Qué premio toca lo decide el «peso» (probabilidad); los quesitos se dibujan todos iguales
// y la ruleta se para dentro del quesito que ha tocado (siempre en el mismo sitio para el mismo giro).
function resultado(ms, premios) {
  const total = premios.reduce((s, p) => s + p.peso, 0);
  const x = ((ms % 1000) / 1000) * total;
  let acum = 0, idx = premios.length - 1;
  for (let i = 0; i < premios.length; i++) { acum += premios[i].peso; if (x < acum) { idx = i; break; } }
  const f = ((Math.floor(ms / 1000) * 7919) % 1000) / 1000;
  return { idx: idx, angulo: ((idx + 0.2 + 0.6 * f) * 360) / premios.length };
}
// Los quesitos que se llaman «Otra vez será», «Sin premio» o «Nada» no son premio: no se canjean.
const sinPremio = (nombre) => /^\s*(otra vez|sin premio|nada\b|sigue intent|vuelve a intent|suerte la pr)/i.test(String(nombre || ""));
// Saca p y c del enlace que da la tarjeta del camarero.
function pcDe(url) {
  try {
    const u = new URL(url);
    const p = u.searchParams.get("p"), c = u.searchParams.get("c");
    if (/^[0-9a-f]{32}$/i.test(p || "") && /^[0-9a-f]{16}$/i.test(c || "")) return { p: p.toUpperCase(), c: c.toUpperCase() };
  } catch (e) {}
  return null;
}
// </logica>

function dibujar(lista) {
  const c = $("rueda"), g = c.getContext("2d"), R = c.width / 2;
  g.clearRect(0, 0, c.width, c.height);
  let a0 = 0;
  lista.forEach((p, i) => {
    const a1 = a0 + (Math.PI * 2) / lista.length;
    g.beginPath();
    g.moveTo(R, R);
    g.arc(R, R, R - 4, a0 - Math.PI / 2, a1 - Math.PI / 2);
    g.closePath();
    g.fillStyle = COLORES[i % COLORES.length];
    g.fill();
    g.strokeStyle = "#0a0612";
    g.lineWidth = 4;
    g.stroke();
    g.save();
    g.translate(R, R);
    g.rotate((a0 + a1) / 2 - Math.PI / 2);
    g.fillStyle = "#0a0612";
    g.font = "bold 30px Rubik, sans-serif";
    g.textAlign = "right";
    g.textBaseline = "middle";
    const t = p.nombre.length > 16 ? p.nombre.slice(0, 15) + "…" : p.nombre;
    g.fillText(t, R - 28, 0);
    g.restore();
    a0 = a1;
  });
  g.beginPath();
  g.arc(R, R, 34, 0, Math.PI * 2);
  g.fillStyle = "#0a0612";
  g.fill();
  g.strokeStyle = "#ffe14d";
  g.lineWidth = 6;
  g.stroke();
}

function girarA(angulo, tras) {
  const r = $("rueda");
  const final = 360 * 6 + (360 - angulo);
  r.style.transform = "rotate(" + final + "deg)";
  setTimeout(tras, 5700);
}

function mostrarPremio(nombre, canjeado, cuando, recien) {
  const p = $("premio");
  p.innerHTML = "";
  const a = document.createElement("div");
  if (sinPremio(nombre)) {
    const a0 = document.createElement("div"); a0.textContent = "¡Vaya!";
    const b0 = document.createElement("div"); b0.className = "nombre"; b0.textContent = nombre;
    const c0 = document.createElement("div"); c0.className = "peq"; c0.textContent = "Esta vez no ha habido suerte. ¡En la próxima campaña volverás a girar!";
    p.append(a0, b0, c0); p.classList.remove("oculto"); return;
  }
  a.textContent = canjeado ? "Tu premio (ya canjeado):" : "¡Te ha tocado!";
  const b = document.createElement("div");
  b.className = "nombre";
  b.textContent = nombre;
  p.append(a, b);
  if (recien) {
    const h = document.createElement("div"); h.className = "hecho"; h.textContent = "✔ CANJEADO";
    const t = document.createElement("div"); t.className = "peq"; t.textContent = "Ya está: el camarero te lo da ahora. " + new Date().toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" });
    p.append(h, t);
  } else if (canjeado) {
    const c = document.createElement("div"); c.textContent = "Canjeado" + (cuando ? " el " + cuando : "") + "."; p.append(c);
  } else {
    const bt = document.createElement("button"); bt.type = "button"; bt.className = "pri canjear"; bt.textContent = "🎁 Canjear premio";
    bt.onclick = () => canjearConTarjeta(nombre);
    const t = document.createElement("div"); t.className = "peq"; t.textContent = "Púlsalo cuando estés en la barra: el camarero pasará su tarjeta por tu móvil. Puedes canjearlo otro día.";
    p.append(bt, t);
  }
  p.classList.remove("oculto");
}

// Canje con la tarjeta del camarero. Espera sin límite de tiempo hasta que el camarero pasa su tarjeta
// (o lo marca él desde su panel). En Android lo lee la propia app; en iPhone la tarjeta abre la pantalla de validar.
function pararEspera() {
  if (!espera) return;
  try { espera.ctrl && espera.ctrl.abort(); } catch (e) {}
  try { espera.lock && espera.lock.release(); } catch (e) {}
  try { espera.quitar && espera.quitar(); } catch (e) {}
  espera = null;
}
async function canjearConTarjeta(nombre) {
  pararEspera();
  $("msg").textContent = "";
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent), nfcWeb = "NDEFReader" in window;
  const p = $("premio");
  p.innerHTML = "";
  const caja = document.createElement("div"); caja.className = "espera";
  const ic = document.createElement("div"); ic.className = "icono latido"; ic.textContent = "📲";
  const ti = document.createElement("div"); ti.className = "tit"; ti.textContent = "Esperando la tarjeta del camarero…";
  const pr = document.createElement("div"); pr.className = "nombre"; pr.textContent = nombre;
  const ol = document.createElement("ol");
  const paso = (t) => { const li = document.createElement("li"); li.textContent = t; ol.append(li); };
  if (ios) {
    paso("Enséñale esta pantalla al camarero: acercará su tarjeta a la parte de arriba de tu iPhone.");
    paso("Te saldrá un aviso arriba: tócalo y el premio se canjeará solo.");
  } else {
    paso("Ten el NFC activado (Ajustes › Conexiones › NFC).");
    paso("Enséñale esta pantalla al camarero: acercará su tarjeta a la parte de atrás de tu móvil.");
    paso("No cierres esta pantalla hasta que salga ✔ CANJEADO.");
  }
  const alerta = document.createElement("div"); alerta.className = "alerta oculto";
  const reint = document.createElement("button"); reint.type = "button"; reint.className = "pri oculto"; reint.textContent = "Reintentar";
  const canc = document.createElement("button"); canc.type = "button"; canc.textContent = "Cancelar";
  caja.append(ic, ti, pr, ol, alerta, reint, canc);
  p.append(caja);
  p.classList.remove("oculto");
  espera = {};
  const yo = espera;
  const avisar = (t) => { alerta.textContent = t; alerta.classList.remove("oculto"); };
  canc.onclick = () => { try { localStorage.removeItem("sd_canje_ruleta"); } catch (e) {} pararEspera(); mostrarPremio(nombre, false, ""); };
  reint.onclick = () => canjearConTarjeta(nombre);
  // pantalla siempre encendida mientras espera
  try { if (navigator.wakeLock) yo.lock = await navigator.wakeLock.request("screen"); } catch (e) {}
  // si el camarero lo marca desde su panel (o se canjea desde otra pantalla), se ve aquí al momento
  yo.quitar = onSnapshot(doc(db, "ruleta_giros", usuario.uid), (d) => {
    if (espera !== yo || !d.exists() || d.data().canjeado !== true) return;
    pararEspera();
    if (navigator.vibrate) navigator.vibrate(120);
    mostrarPremio(nombre, true, "", true);
  });
  if (!nfcWeb) {
    try { localStorage.setItem("sd_canje_ruleta", String(Date.now())); } catch (e) {}
    if (!ios) avisar("Este navegador no lee NFC. Abre la app con Chrome, o pide al camarero que lo marque desde su panel.");
    return;
  }
  try {
    yo.ctrl = new AbortController();
    const lector = new NDEFReader();
    await lector.scan({ signal: yo.ctrl.signal });
    lector.onreading = async (ev) => {
      if (espera !== yo) return;
      let url = "";
      for (const rec of ev.message.records) if (rec.recordType === "url" || rec.recordType === "absolute-url") url = new TextDecoder().decode(rec.data);
      const pc = pcDe(url);
      if (!pc) { avisar("Esa tarjeta no es la del camarero de Sweet Dreams. Que acerque la suya."); return; }
      try { yo.ctrl.abort(); } catch (e) {}
      try {
        await updateDoc(doc(db, "ruleta_giros", usuario.uid), { canjeado: true, canjeadoEn: serverTimestamp(), canjeP: pc.p, canjeC: pc.c, canjeEstado: "pendiente" });
        pararEspera();
        if (navigator.vibrate) navigator.vibrate(120);
        mostrarPremio(nombre, true, "", true);
      } catch (e) { avisar("No se ha podido canjear (" + (e.code || e.message) + "). Pulsa «Reintentar» o pide al camarero que lo marque desde su panel."); reint.classList.remove("oculto"); }
    };
    lector.onreadingerror = () => avisar("No se ha podido leer la tarjeta. Que el camarero la acerque otra vez, despacio.");
  } catch (e) {
    if (e && e.name === "NotReadableError") avisar("⚠ El NFC de tu móvil está apagado. Actívalo en Ajustes › Conexiones › NFC y pulsa «Reintentar».");
    else if (e && e.name === "NotAllowedError") avisar("⚠ Tienes que permitir que la app use el NFC. Pulsa «Reintentar» y acepta.");
    else avisar("No se puede leer NFC en este móvil. Pide al camarero que marque el premio desde su panel.");
    reint.classList.remove("oculto");
  }
}

async function girar() {
  $("girar").disabled = true;
  $("msg").textContent = "";
  try {
    await setDoc(doc(db, "ruleta_giros", usuario.uid), { uid: usuario.uid, giro: serverTimestamp(), version: config.version });
    const s = await getDoc(doc(db, "ruleta_giros", usuario.uid));
    const r = resultado(s.data().giro.toMillis(), premios);
    $("girar").classList.add("oculto");
    $("aviso").classList.add("oculto");
    girarA(r.angulo, () => mostrarPremio(premios[r.idx].nombre, false, ""));
  } catch (e) {
    $("msg").textContent = "No se ha podido girar: " + (e.code === "permission-denied" ? "ya has girado o la ruleta no está disponible." : (e.code || e.message));
  }
}
$("girar").onclick = girar;

onAuthStateChanged(auth, async (u) => {
  usuario = u;
  $("panel").classList.add("oculto");
  if (!u) { $("estado").innerHTML = 'Primero inicia sesión en el <a href="./">inicio</a>.'; return; }
  try {
    const f = (await getDoc(doc(db, "users", u.uid))).data() || {};
    if (f.socio !== true && f.role !== "admin") { $("estado").textContent = "La ruleta es solo para socios. Pregunta en el bar cómo hacerte socio."; return; }
    const mio = await getDoc(doc(db, "ruleta_giros", u.uid));
    if (mio.exists()) {
      const g = mio.data();
      const v = await getDoc(doc(db, "ruleta_versiones", String(g.version)));
      premios = v.data().premios;
      const r = resultado(g.giro.toMillis(), premios);
      dibujar(premios);
      $("rueda").style.transition = "none";
      $("rueda").style.transform = "rotate(" + (360 * 6 + (360 - r.angulo)) + "deg)";
      $("girar").classList.add("oculto");
      $("aviso").classList.add("oculto");
      mostrarPremio(premios[r.idx].nombre, g.canjeado === true, g.canjeadoEn && g.canjeadoEn.toDate ? g.canjeadoEn.toDate().toLocaleDateString("es-ES") : "");
    } else {
      const c = await getDoc(doc(db, "ruleta_config", "actual"));
      if (!c.exists() || c.data().activa !== true) { $("estado").textContent = "La ruleta no está disponible ahora mismo. Vuelve pronto."; return; }
      config = c.data();
      const v = await getDoc(doc(db, "ruleta_versiones", String(config.version)));
      premios = v.data().premios;
      dibujar(premios);
    }
    $("estado").textContent = "";
    $("panel").classList.remove("oculto");
  } catch (e) { $("estado").textContent = "Error: " + (e.code || e.message); }
});
</script>
</main></body></html>
