<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Competición de trivial</title>
<meta name="theme-color" content="#0a0612">
<link rel="stylesheet" href="estilo.css">
<style>
body{margin:0;padding:16px 14px 50px;display:flex;justify-content:center}
main{width:100%;max-width:560px}
.peq{font-size:.82rem;opacity:.8}
.tabs{display:flex;gap:8px;margin:12px 0}
.tabs button{flex:1;margin:0;padding:11px 4px;font-size:.88rem}
.tabs.sub button{padding:8px 4px;font-size:.8rem}
.tr-mis{display:flex;gap:8px;margin-top:6px}
.tr-mis div{flex:1;text-align:center;padding:8px 4px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12)}
.tr-mis b{display:block;font-family:"Bungee","Rubik",sans-serif;font-size:1.25rem;color:#ffe14d}
.tr-mis span{font-size:.7rem;opacity:.8}
.tr-caja{margin-top:10px;padding:14px;border-radius:16px;border:1.5px solid rgba(25,242,255,.45);background:rgba(10,6,18,.55)}
.tr-caja h3{margin:0 0 6px;font-family:"Bungee","Rubik",sans-serif;font-size:1.05rem;color:#19f2ff}
.tr-caja button{width:100%;margin-top:10px;padding:13px}
.tr-premio{margin-top:10px;padding:10px 12px;border-radius:12px;background:rgba(255,225,77,.12);border:1.5px solid #ffe14d;color:#ffe14d;font-weight:700;font-size:.86rem}
.tr-fila{display:flex;align-items:center;gap:10px;padding:9px 6px;border-bottom:1px solid rgba(255,255,255,.08)}
.tr-fila .pos{width:2.2em;text-align:center;font-family:"Bungee","Rubik",sans-serif;color:#ffe14d}
.tr-fila .nom{flex:1;font-weight:700}
.tr-fila .val{font-family:"Bungee","Rubik",sans-serif;color:#19f2ff}
.tr-fila small{display:block;font-weight:400;opacity:.7;font-size:.72rem}
.tr-fila.yo{background:rgba(93,255,154,.14);border-radius:10px}
#tr-juego{position:fixed;inset:0;background:#0a0612;padding:18px 16px 30px;overflow:auto;z-index:30;display:flex;flex-direction:column}
#tr-juego .cab{display:flex;justify-content:space-between;align-items:center;font-size:.85rem;opacity:.85}
#tr-barra{height:10px;border-radius:999px;background:rgba(255,255,255,.12);margin:10px 0 16px;overflow:hidden}
#tr-barra div{height:100%;width:100%;background:linear-gradient(90deg,#5dff9a,#ffe14d,#ff5c7a);transition:width .2s linear}
#tr-preg{font-size:1.2rem;font-weight:800;line-height:1.3;margin:6px 0 14px}
#tr-cat{display:inline-block;padding:2px 10px;border-radius:999px;background:rgba(139,92,255,.35);font-size:.74rem;font-weight:800}
.tr-op{display:block;width:100%;margin:0 0 10px;padding:14px 12px;text-align:left;font-size:1rem}
.tr-op.bien{background:#16351f!important;border-color:#5dff9a!important;color:#5dff9a!important}
.tr-op.mal{background:#3a1a1f!important;border-color:#ff5c7a!important;color:#ff9aaa!important}
#tr-info{min-height:1.4em;font-weight:800;margin:4px 0 10px}
#tr-sig{margin-top:auto;padding:14px}
.oculto{display:none!important}
</style></head>
<body><main>
<p style="margin:0 0 4px"><a href="juegos.html">← Juegos</a></p>
<header class="marca"><h1>Competición de trivial</h1></header>
<p id="estado">Cargando…</p>
<div id="app" class="oculto">
  <div class="tr-mis" id="mis"></div>
  <div class="tabs" id="tabs"><button data-v="reto" class="sel">Reto de hoy</button><button data-v="libre">Partida libre</button><button data-v="rank">Ranking</button></div>
  <section id="vReto"></section>
  <section id="vLibre" class="oculto"></section>
  <section id="vRank" class="oculto">
    <div class="tabs sub" id="tabsRank"><button data-r="semana" class="sel">Semana</button><button data-r="mes">Mes</button><button data-r="historico">Histórico</button></div>
    <div id="rank"></div>
    <div id="ganadores"></div>
  </section>
</div>
<div id="tr-juego" class="oculto">
  <div class="cab"><span id="tr-num"></span><span id="tr-seg"></span></div>
  <div id="tr-barra"><div></div></div>
  <div><span id="tr-cat"></span></div>
  <div id="tr-preg"></div>
  <div id="tr-ops"></div>
  <div id="tr-info"></div>
  <button id="tr-sig" class="pri oculto">Siguiente</button>
</div>
<script>
window.addEventListener("error", function (e) {
  var s = document.getElementById("estado");
  if (s) s.textContent = "Error en la página: " + e.message + " (línea " + e.lineno + ")";
});
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";
import { getFirestore, doc, collection, getDoc, getDocs, setDoc, query, orderBy, limit, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";
const app = initializeApp({
  apiKey: "AIzaSyByyLDyO2f0AYGtzVgdL006DRT2AE0n7kw",
  authDomain: "sweet-dreams-darts.firebaseapp.com",
  projectId: "sweet-dreams-darts",
  storageBucket: "sweet-dreams-darts.firebasestorage.app",
  messagingSenderId: "232279000383",
  appId: "1:232279000383:web:f40d9ae65a4266f372bf8a"
});
const auth = getAuth(app);
const db = getFirestore(app);
const $ = (id) => document.getElementById(id);
const el = (tag, txt, cls) => { const e = document.createElement(tag); if (txt !== undefined && txt !== null && txt !== "") e.textContent = txt; if (cls) e.className = cls; return e; };

// <logica>
const pad = (n) => String(n).padStart(2, "0");
const iso = (d) => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
// La jornada del bar acaba a las 6:00: hasta entonces cuenta el día anterior (igual que el robot).
const diaBar = (ahora) => iso(new Date(ahora.getFullYear(), ahora.getMonth(), ahora.getDate() - (ahora.getHours() < 6 ? 1 : 0)));
function claveSemana(diaIso) {
  const [y, m, d] = diaIso.split("-").map(Number), f = new Date(Date.UTC(y, m - 1, d)), dw = f.getUTCDay() || 7;
  f.setUTCDate(f.getUTCDate() + 4 - dw);
  const ini = new Date(Date.UTC(f.getUTCFullYear(), 0, 1));
  return f.getUTCFullYear() + "-S" + pad(Math.ceil(((f - ini) / 86400000 + 1) / 7));
}
const claveMes = (diaIso) => diaIso.slice(0, 7);
// Mis números del periodo que se ve ahora (si el periodo guardado es otro, empiezan en cero).
function misNumeros(p, ks, km) {
  const b = (x, k) => (x && (k === undefined || x.k === k) ? { a: x.a || 0, f: x.f || 0 } : { a: 0, f: 0 });
  return { semana: b(p && p.semana, ks), mes: b(p && p.mes, km), h: b(p && p.h) };
}
// Preguntas de la partida libre que todavía no he contestado.
function pendientesLibre(docs, cat, hechas) {
  const out = [];
  for (const d of docs) {
    if (cat !== "todas" && d.cat !== cat) continue;
    for (const q of d.preguntas || []) if (!hechas.has(q.id)) out.push(Object.assign({ cat: d.cat }, q));
  }
  return out;
}
function barajar(a, rnd) { const r = a.slice(); for (let i = r.length - 1; i > 0; i--) { const j = Math.floor((rnd || Math.random)() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; }
const MESES = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
const textoPeriodo = (tipo, k) => (tipo === "semana" ? "semana " + Number(k.split("-S")[1]) + " de " + k.split("-S")[0] : MESES[Number(k.split("-")[1]) - 1] + " de " + k.split("-")[0]);
// </logica>

let uid = "", nombre = "", cfg = {}, reto = null, puntos = null, ranking = null, hechas = new Set(), cats = [], vistaRank = "semana";
const LOCAL = () => "sd_trivial_hechas_" + uid;
function guardarLocal() { try { localStorage.setItem(LOCAL(), JSON.stringify([...hechas].slice(-3000))); } catch (e) {} }

function pestana(v) {
  document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("sel", b.dataset.v === v));
  $("vReto").classList.toggle("oculto", v !== "reto");
  $("vLibre").classList.toggle("oculto", v !== "libre");
  $("vRank").classList.toggle("oculto", v !== "rank");
}
document.querySelectorAll("#tabs button").forEach((b) => (b.onclick = () => pestana(b.dataset.v)));
document.querySelectorAll("#tabsRank button").forEach((b) => (b.onclick = () => { vistaRank = b.dataset.r; document.querySelectorAll("#tabsRank button").forEach((x) => x.classList.toggle("sel", x === b)); pintarRanking(); }));

function pintarMis() {
  const hoy = diaBar(new Date()), n = misNumeros(puntos, claveSemana(hoy), claveMes(hoy)), c = $("mis");
  c.innerHTML = "";
  [["semana", "aciertos esta semana"], ["mes", "aciertos este mes"], ["h", "aciertos en total"]].forEach(([k, t]) => { const d = el("div"); d.append(el("b", String(n[k].a)), el("span", t)); c.append(d); });
}

// ---------- reto de hoy ----------
async function estadoReto() {
  if (!reto) return { hechas: 0, total: 0, aciertos: 0 };
  let h = 0;
  for (const id of reto.ids) if (hechas.has(id)) h++;
  return { hechas: h, total: reto.ids.length };
}
async function pintarReto() {
  const c = $("vReto");
  c.innerHTML = "";
  const caja = el("div", "", "tr-caja");
  caja.append(el("h3", "🎯 Reto de hoy"));
  if (!reto || !reto.abierto) { caja.append(el("p", "Hoy todavía no hay reto. Se publica cada mañana: vuelve en un rato.", "peq")); c.append(caja); return; }
  const e = await estadoReto();
  caja.append(el("p", reto.ids.length + " preguntas iguales para todos · " + (reto.seg || cfg.seg || 20) + " segundos por pregunta · una sola oportunidad. Cada acierto suma en el ranking.", "peq"));
  if (e.hechas >= e.total) caja.append(el("p", "✔ Ya has hecho el reto de hoy. ¡Mañana hay otro! Tus aciertos aparecen en el ranking en unos minutos.", ""));
  else {
    const b = el("button", e.hechas ? "Continuar el reto (" + (e.total - e.hechas) + " preguntas)" : "Empezar el reto", "pri");
    b.onclick = () => jugar(reto.preguntas.filter((q) => !hechas.has(q.id)), "R");
    caja.append(b);
    if (e.hechas) caja.append(el("p", "Si sales a mitad, las preguntas que abriste y no contestaste cuentan como fallo.", "peq"));
  }
  if (cfg.premiosActivos && cfg.premioSemana) caja.append(el("div", "🏆 Premio de la semana: " + cfg.premioSemana, "tr-premio"));
  c.append(caja);
}

// ---------- partida libre ----------
let libreDocs = [];
async function pintarLibre() {
  const c = $("vLibre");
  c.innerHTML = "";
  const caja = el("div", "", "tr-caja");
  caja.append(el("h3", "🎲 Partida libre"));
  caja.append(el("p", "10 preguntas de la categoría que quieras. Cada pregunta solo puntúa la primera vez que la contestas, así que nunca te saldrá repetida.", "peq"));
  const sel = document.createElement("select");
  sel.style.cssText = "width:100%;padding:11px;border-radius:12px;background:#150d27;color:#fff;border:1.5px solid rgba(255,255,255,.2);margin-top:6px";
  sel.add(new Option("Todas las categorías", "todas"));
  cats.forEach((k) => sel.add(new Option(k, k)));
  const info = el("p", "", "peq");
  const b = el("button", "Jugar", "pri");
  const actualizar = () => { const n = pendientesLibre(libreDocs, sel.value, hechas).length; info.textContent = n ? "Te quedan " + n + " preguntas nuevas en esta categoría." : "Ya has contestado todas las de esta categoría. Pronto habrá más."; b.disabled = !n; };
  sel.onchange = actualizar;
  b.onclick = () => jugar(barajar(pendientesLibre(libreDocs, sel.value, hechas)).slice(0, 10), "L");
  caja.append(sel, info, b);
  c.append(caja);
  actualizar();
}

// ---------- jugar ----------
let cola = [], modo = "", idx = 0, reloj = null, aciertosPartida = 0;
function jugar(preguntas, m) {
  if (!preguntas.length) return;
  cola = preguntas; modo = m; idx = 0; aciertosPartida = 0;
  $("tr-juego").classList.remove("oculto");
  siguiente();
}
async function cerrarJuego() {
  $("tr-juego").classList.add("oculto");
  clearInterval(reloj);
  await recargar();
}
$("tr-sig").onclick = () => { idx++; if (idx >= cola.length) return fin(); siguiente(); };
function fin() {
  clearInterval(reloj);
  $("tr-num").textContent = "";
  $("tr-seg").textContent = "";
  $("tr-cat").textContent = "";
  $("tr-preg").textContent = "¡Terminado! " + aciertosPartida + " de " + cola.length + " aciertos";
  $("tr-ops").innerHTML = "";
  $("tr-info").textContent = "Los puntos los suma el robot del bar: aparecerán en el ranking en unos minutos.";
  $("tr-barra").firstElementChild.style.width = "0%";
  const b = $("tr-sig");
  b.textContent = "Volver";
  b.classList.remove("oculto");
  b.onclick = () => { b.onclick = () => { idx++; if (idx >= cola.length) return fin(); siguiente(); }; cerrarJuego(); };
}
async function siguiente() {
  const q = cola[idx], seg = Number((modo === "R" && reto && reto.seg) || cfg.seg || 20);
  $("tr-sig").classList.add("oculto");
  $("tr-sig").textContent = idx + 1 >= cola.length ? "Ver resultado" : "Siguiente";
  $("tr-num").textContent = (modo === "R" ? "Reto · " : "Libre · ") + "Pregunta " + (idx + 1) + " de " + cola.length;
  $("tr-cat").textContent = q.cat || "";
  $("tr-preg").textContent = q.p;
  $("tr-info").textContent = "";
  const ops = $("tr-ops");
  ops.innerHTML = "";
  // abrir la pregunta: desde aquí corre el tiempo (lo apunta el servidor, no el móvil)
  try {
    const datos = { uid: uid, q: q.id, modo: modo, t: serverTimestamp() };
    if (modo === "R") datos.dia = reto.dia; else datos.cat = q.cat;
    await setDoc(doc(db, "trivial_aperturas", uid + "_" + q.id), datos);
  } catch (e) {
    hechas.add(q.id); guardarLocal();
    $("tr-info").textContent = "Esta pregunta ya la habías abierto antes: no puede volver a jugarse.";
    $("tr-sig").classList.remove("oculto");
    return;
  }
  hechas.add(q.id); guardarLocal();
  let quedan = seg, contestada = false;
  const pintarReloj = () => { $("tr-seg").textContent = "⏱ " + quedan + " s"; $("tr-barra").firstElementChild.style.width = (100 * quedan / seg) + "%"; };
  pintarReloj();
  const responder = async (e, boton) => {
    if (contestada) return;
    contestada = true;
    clearInterval(reloj);
    [...ops.children].forEach((b) => (b.disabled = true));
    try {
      await setDoc(doc(db, "trivial_resp", uid + "_" + q.id), { uid: uid, q: q.id, e: e, t: serverTimestamp(), nombre: nombre });
      const s = await getDoc(doc(db, "trivial_sol", q.id));
      const c = s.exists() ? s.data().c : -1;
      if (c >= 0) ops.children[c].classList.add("bien");
      if (e === c) { aciertosPartida++; $("tr-info").textContent = "✔ ¡Correcto!"; }
      else { if (boton) boton.classList.add("mal"); $("tr-info").textContent = e === -1 ? "⏱ Se acabó el tiempo." : "✘ No era esa."; }
    } catch (er) { $("tr-info").textContent = "⏱ Fuera de tiempo: cuenta como fallo."; }
    $("tr-sig").classList.remove("oculto");
  };
  q.ops.forEach((t, i) => { const b = el("button", t, "tr-op"); b.type = "button"; b.onclick = () => responder(i, b); ops.append(b); });
  clearInterval(reloj);
  reloj = setInterval(() => { quedan--; pintarReloj(); if (quedan <= 0) responder(-1, null); }, 1000);
}

// ---------- ranking ----------
function pintarRanking() {
  const c = $("rank");
  c.innerHTML = "";
  const hoy = diaBar(new Date()), k = vistaRank === "semana" ? claveSemana(hoy) : vistaRank === "mes" ? claveMes(hoy) : null;
  const caja = el("div", "", "tr-caja");
  caja.append(el("h3", vistaRank === "semana" ? "🏆 Ranking de la semana" : vistaRank === "mes" ? "🏆 Ranking del mes" : "🏆 Más aciertos de la historia"));
  const premio = vistaRank === "semana" ? cfg.premioSemana : vistaRank === "mes" ? cfg.premioMes : "";
  if (cfg.premiosActivos && premio) caja.append(el("div", "Premio para el 1º: " + premio, "tr-premio"));
  const bloque = ranking && ranking[vistaRank];
  const lista = bloque && (k === null || bloque.k === k) ? bloque.lista || [] : [];
  if (!lista.length) caja.append(el("p", "Todavía no hay nadie. ¡Sé el primero!", "peq"));
  let pos = 0, ant = null;
  lista.forEach((x, i) => {
    if (!ant || ant.a !== x.a || ant.f !== x.f || ant.t !== x.t) pos = i + 1;
    ant = x;
    const f = el("div", "", "tr-fila" + (x.uid === uid ? " yo" : ""));
    const n = el("div", "", "nom");
    n.append(document.createTextNode(x.n + (x.uid === uid ? " (tú)" : "")), el("small", x.a + " aciertos · " + x.f + " fallos"));
    f.append(el("div", pos <= 3 ? ["🥇", "🥈", "🥉"][pos - 1] : String(pos), "pos"), n, el("div", String(x.a), "val"));
    caja.append(f);
  });
  caja.append(el("p", "A igualdad de aciertos, gana quien tiene menos fallos y, después, quien contestó más rápido. Se actualiza cada 10 minutos.", "peq"));
  c.append(caja);
}
async function pintarGanadores() {
  const c = $("ganadores");
  c.innerHTML = "";
  try {
    const s = await getDocs(query(collection(db, "trivial_ganadores"), orderBy("cerrado", "desc"), limit(6)));
    if (s.empty) return;
    const caja = el("div", "", "tr-caja");
    caja.append(el("h3", "👑 Últimos ganadores"));
    s.docs.forEach((d) => { const g = d.data(); const f = el("div", "", "tr-fila"); const n = el("div", "", "nom"); n.append(document.createTextNode(g.n), el("small", "Ganador de la " + textoPeriodo(g.tipo, g.k) + " · " + g.a + " aciertos" + (g.premio ? " · " + g.premio : ""))); f.append(el("div", "👑", "pos"), n); caja.append(f); });
    c.append(caja);
  } catch (e) {}
}

async function recargar() {
  const hoy = diaBar(new Date());
  const [c, r, p, rk] = await Promise.all([getDoc(doc(db, "trivial_config", "ajustes")), getDoc(doc(db, "trivial_retos", hoy)), getDoc(doc(db, "trivial_puntos", uid)), getDoc(doc(db, "trivial_ranking", "actual"))]);
  cfg = c.exists() ? c.data() : {};
  reto = r.exists() ? r.data() : null;
  puntos = p.exists() ? p.data() : null;
  ranking = rk.exists() ? rk.data() : null;
  if (puntos && puntos.hechas) puntos.hechas.forEach((x) => hechas.add(x));
  cats = cfg.cats || [];
  libreDocs = (await Promise.all(cats.map((k) => getDoc(doc(db, "trivial_libre", k))))).filter((d) => d.exists()).map((d) => Object.assign({ cat: d.id }, d.data()));
  pintarMis();
  await pintarReto();
  await pintarLibre();
  pintarRanking();
  pintarGanadores();
}

onAuthStateChanged(auth, async (u) => {
  $("app").classList.add("oculto");
  if (!u) { $("estado").innerHTML = 'Para competir en el trivial, primero <a href="./">inicia sesión o regístrate</a>.'; return; }
  try {
    uid = u.uid;
    const f = await getDoc(doc(db, "users", uid));
    nombre = f.exists() ? f.data().nombre || "" : "";
    try { JSON.parse(localStorage.getItem(LOCAL()) || "[]").forEach((x) => hechas.add(x)); } catch (e) {}
    await recargar();
    $("estado").textContent = "";
    $("app").classList.remove("oculto");
  } catch (e) { $("estado").textContent = "Error: " + (e.code || e.message); }
});
</script>
</main></body></html>
